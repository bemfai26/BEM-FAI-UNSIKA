<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - BEM FAI UNSIKA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#FDFBFF] flex items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 border border-purple-pale">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-purple-pale rounded-full mx-auto flex items-center justify-center mb-4">
                <i data-lucide="lock" class="w-10 h-10 text-purple-med"></i>
            </div>
            <h1 class="text-2xl font-bold text-purple-deep">Admin Panel</h1>
            <p class="text-sm text-gray-500 mt-2">Masuk untuk mengelola berita</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Username / Email</label>
                <div class="relative">
                    <input type="email" id="email" required class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-purple-med/20 focus:border-purple-med outline-none transition-all">
                    <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password" required class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-purple-med/20 focus:border-purple-med outline-none transition-all">
                    <i data-lucide="key" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-4 bg-purple-med text-white font-bold rounded-xl hover:bg-purple-deep transition-all shadow-lg shadow-purple-med/20 flex items-center justify-center gap-2">
                Masuk Sekarang
            </button>
        </form>

        <div id="error-msg" class="mt-6 p-4 bg-red-50 text-red-600 text-sm rounded-xl hidden"></div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword } from '../js/firebase-init.js';
        
        lucide.createIcons();

        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Memproses...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error(error);
                errorMsg.innerText = 'Login gagal. Periksa kembali email dan password Anda.';
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Masuk Sekarang';
            }
        });
    </script>
</body>
</html>
