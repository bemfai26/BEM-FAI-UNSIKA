<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - BEM FAI UNSIKA</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            purple: {
              deep: '#2D1B4E',
              med: '#5B3A8C',
              light: '#9B72CF',
              soft: '#D4BEF0',
              pale: '#F3ECFA'
            }
          }
        }
      }
    }
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

    <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FDFBFF;
    }

    /* Glass Sidebar */
    .sidebar {
      position: fixed;
      left: 20px;
      top: 20px;
      bottom: 20px;
      width: 280px;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 40px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(45,27,78,0.1);
      z-index: 50;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: 18px;
      font-weight: 600;
      color: #2D1B4E;
      transition: 0.3s;
      width: 100%;
      text-align: left;
    }

    .sidebar-link:hover {
      background: rgba(255,255,255,0.6);
      transform: translateX(6px);
    }

    .main {
      margin-left: 320px;
    }

    /* Drop Area */
    .drop-area {
      border: 2px dashed #9B72CF;
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .drop-area:hover { background: #F3ECFA; }

    #image-preview, .gallery-preview-item {
      max-height: 200px;
      object-fit: cover;
      border-radius: 12px;
    }
    
    .ql-editor {
      min-height: 250px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="text-center mb-10">
    <img src="../assets/Logo/logo-bem.png" class="w-20 h-20 mx-auto rounded-3xl shadow-lg mb-3">
    <div class="font-black text-purple-900 leading-tight">BEM FAI UNSIKA</div>
    <div class="text-[10px] tracking-widest text-purple-600 mt-1 uppercase font-bold">Poros Katalist</div>
  </div>

  <nav class="flex flex-col gap-2 flex-1">
    <button onclick="showView('list')" class="sidebar-link">
      <i data-lucide="layout-grid"></i> Kelola Berita
    </button>
    <button onclick="showView('form')" class="sidebar-link">
      <i data-lucide="plus-circle"></i> Tulis Berita
    </button>
    <button id="logout-btn" class="sidebar-link text-red-500 mt-auto">
      <i data-lucide="log-out"></i> Keluar
    </button>
  </nav>
</aside>

<!-- MAIN CONTENT -->
<main class="main p-8 pb-20">
  <div class="mb-8">
    <h1 id="view-title" class="text-2xl font-bold text-purple-900">Kelola Berita</h1>
    <p id="view-subtitle" class="text-gray-500 text-sm">Dashboard administrasi berita</p>
  </div>

  <!-- LIST VIEW -->
  <div id="view-list">
    <div class="bg-white rounded-2xl shadow p-4 overflow-hidden border border-purple-pale">
      <table class="w-full text-sm">
        <thead class="text-gray-400 border-b text-center">
          <tr>
            <th class="text-left p-3">Judul Berita</th>
            <th>Kategori</th>
            <th>Tanggal</th>
            <th class="text-right p-3">Aksi</th>
          </tr>
        </thead>
        <tbody id="news-table-body" class="divide-y divide-gray-50"></tbody>
      </table>
    </div>
  </div>

  <!-- FORM VIEW -->
  <div id="view-form" class="hidden">
    <form id="news-form" class="max-w-4xl bg-white p-8 rounded-3xl shadow-xl space-y-6 border border-purple-pale">
      <input type="hidden" id="edit-id">

      <div class="space-y-2">
          <label class="text-sm font-bold text-purple-deep">Judul Berita</label>
          <input id="news-title" required placeholder="Masukkan judul berita..." class="w-full p-3 bg-gray-50 border border-purple-pale rounded-xl outline-none focus:ring-2 focus:ring-purple-light/20">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
              <label class="text-sm font-bold text-purple-deep">Kategori</label>
              <select id="news-category" class="w-full p-3 bg-gray-50 border border-purple-pale rounded-xl outline-none">
                  <option>Kegiatan</option>
                  <option>Sosial</option>
                  <option>Pelatihan</option>
                  <option>Pendidikan</option>
                  <option>Kajian</option>
              </select>
          </div>
          <div class="space-y-2">
              <label class="text-sm font-bold text-purple-deep">Tanggal</label>
              <input type="date" id="news-date" required class="w-full p-3 bg-gray-50 border border-purple-pale rounded-xl outline-none">
          </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
              <label class="text-sm font-bold text-purple-deep">Penulis</label>
              <input id="news-author" placeholder="Nama Penulis" required class="w-full p-3 bg-gray-50 border border-purple-pale rounded-xl outline-none">
          </div>
          <div class="space-y-2">
              <label class="text-sm font-bold text-purple-deep">Departemen</label>
              <select id="news-department" class="w-full p-3 bg-gray-50 border border-purple-pale rounded-xl outline-none">
                  <option>Sekretaris Umum</option>
                  <option>Bendahara Umum</option>
                  <option>Departemen Kearsipan</option>
                  <option>Departemen Agama</option>
                  <option>Departemen PSDA</option>
                  <option>Departemen Sospol</option>
                  <option>Departemen Kominfo</option>
                  <option>Departemen Luar Negeri</option>
                  <option>Departemen Dalam Negeri</option>
                  <option>Departemen Minat & Bakat</option>
              </select>
          </div>
      </div>

      <div class="space-y-2">
          <label class="text-sm font-bold text-purple-deep">Konten Berita</label>
          <div id="editor" class="bg-gray-50 border border-purple-pale rounded-xl overflow-hidden"></div>
      </div>

      <!-- MAIN IMAGE -->
      <div class="border border-purple-pale rounded-2xl p-6 bg-purple-pale/10 space-y-4">
        <div class="flex items-center justify-between">
          <p class="font-bold text-purple-deep flex items-center gap-2 italic">
            <i data-lucide="image" class="w-4 h-4"></i> Gambar Utama
          </p>
          <select id="image-mode" class="text-[10px] bg-white border border-purple-pale rounded-lg p-2 font-black uppercase text-purple-med">
            <option value="url">Gunakan URL</option>
            <option value="upload">Upload File</option>
          </select>
        </div>
        <div id="url-input-group">
          <input id="news-image" placeholder="https://..." class="w-full p-3 bg-white border border-purple-pale rounded-xl outline-none">
        </div>
        <div id="upload-input-group" class="hidden">
          <input type="file" id="news-file" accept="image/*" class="hidden">
          <div id="main-drop-area" class="drop-area text-xs text-gray-400">
            Drag & Drop atau Klik untuk Upload Gambar Utama
          </div>
        </div>
        <img id="image-preview" class="hidden w-full border border-purple-pale bg-white">
      </div>

      <!-- DOCUMENTATION GALLERY -->
      <div class="border border-purple-pale rounded-2xl p-6 bg-gray-50 space-y-4">
          <div class="flex items-center justify-between">
              <p class="font-bold text-purple-deep flex items-center gap-2 italic">
                  <i data-lucide="images" class="w-4 h-4"></i> Dokumentasi <span class="text-[10px] text-gray-400 font-normal">(Maksimal 8 Foto)</span>
              </p>
              <button type="button" onclick="document.getElementById('gallery-files').click()" class="text-xs bg-purple-med text-white px-4 py-2 rounded-lg font-bold">Tambah Foto</button>
          </div>
          <input type="file" id="gallery-files" accept="image/*" multiple class="hidden">
          <div id="gallery-preview" class="grid grid-cols-2 md:grid-cols-4 gap-4">
              <!-- Gallery items will appear here -->
          </div>
      </div>

      <div class="flex justify-end gap-3 pt-6 border-t border-purple-pale/30">
        <button type="button" onclick="showView('list')" class="px-6 py-2 text-gray-500 font-bold">Batal</button>
        <button id="save-btn" class="px-10 py-3 bg-purple-med text-white rounded-xl font-black shadow-xl shadow-purple-med/30 hover:-translate-y-1 transition-all uppercase tracking-widest text-xs">
          Simpan Berita
        </button>
      </div>
    </form>
  </div>
</main>

<script type="module">
import {
  auth, db, storage, ref, uploadBytes, getDownloadURL,
  collection, addDoc, updateDoc, deleteDoc, setDoc,
  doc, getDocs, getDoc,
  query, orderBy,
  serverTimestamp,
  onAuthStateChanged,
  signOut
} from '../js/firebase-init.js';

lucide.createIcons();

const quill = new Quill('#editor', {
  theme: 'snow',
  placeholder: 'Tulis isi berita di sini...',
  modules: {
    toolbar: [
      [{ header: [1, 2, 3, false] }],
      ['bold', 'italic', 'underline'],
      ['link', 'blockquote'],
      [{ list: 'ordered' }, { list: 'bullet' }],
      ['clean']
    ]
  }
});

const viewList = document.getElementById('view-list');
const viewForm = document.getElementById('view-form');
const tableBody = document.getElementById('news-table-body');
const newsForm = document.getElementById('news-form');
const editIdInput = document.getElementById('edit-id');
const imageMode = document.getElementById('image-mode');
const imageInput = document.getElementById('news-image');
const fileInput = document.getElementById('news-file');
const imagePreview = document.getElementById('image-preview');
const dropArea = document.getElementById('main-drop-area');
const galleryFiles = document.getElementById('gallery-files');
const galleryPreview = document.getElementById('gallery-preview');

let selectedGalleryFiles = []; // To store files to upload
let existingGalleryUrls = [];   // To store existing URLs when editing

onAuthStateChanged(auth, (user) => {
  if (!user) { location.href = "login.html"; return; }
  loadNews();
});

window.showView = (view) => {
  viewList.classList.add('hidden');
  viewForm.classList.add('hidden');

  if (view === 'form') {
    newsForm.reset();
    editIdInput.value = "";
    quill.root.innerHTML = "";
    imagePreview.classList.add('hidden');
    galleryPreview.innerHTML = "";
    selectedGalleryFiles = [];
    existingGalleryUrls = [];
    document.getElementById('view-title').innerText = 'Tulis Berita';
    viewForm.classList.remove('hidden');
  } else {
    document.getElementById('view-title').innerText = 'Kelola Berita';
    viewList.classList.remove('hidden');
    loadNews();
  }
};

imageMode.addEventListener('change', () => {
  document.getElementById('url-input-group').classList.toggle('hidden', imageMode.value !== 'url');
  document.getElementById('upload-input-group').classList.toggle('hidden', imageMode.value === 'url');
});

imageInput.addEventListener('input', () => {
  if (imageInput.value) { imagePreview.src = imageInput.value; imagePreview.classList.remove('hidden'); }
  else { imagePreview.classList.add('hidden'); }
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => { imagePreview.src = e.target.result; imagePreview.classList.remove('hidden'); };
    reader.readAsDataURL(file);
  }
});

dropArea.addEventListener('click', () => fileInput.click());
dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('bg-purple-100'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('bg-purple-100'));
dropArea.addEventListener('drop', (e) => {
  e.preventDefault();
  dropArea.classList.remove('bg-purple-100');
  fileInput.files = e.dataTransfer.files;
  fileInput.dispatchEvent(new Event('change'));
});

// Gallery Logic
galleryFiles.addEventListener('change', () => {
    const files = Array.from(galleryFiles.files);
    if (selectedGalleryFiles.length + existingGalleryUrls.length + files.length > 8) {
        alert("Maksimal 8 foto dokumentasi!");
        return;
    }
    
    files.forEach(file => {
        selectedGalleryFiles.push(file);
        const reader = new FileReader();
        reader.onload = (e) => { renderGalleryItem(e.target.result, true, selectedGalleryFiles.length - 1); };
        reader.readAsDataURL(file);
    });
});

function renderGalleryItem(src, isNew, index) {
    const div = document.createElement('div');
    div.className = "relative group aspect-square";
    div.innerHTML = `
        <img src="${src}" class="w-full h-full object-cover rounded-xl border border-purple-pale">
        <button type="button" class="absolute top-1 right-1 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity" onclick="removeGalleryItem(${isNew}, ${index})">
            <i data-lucide="x" class="w-3 h-3"></i>
        </button>
    `;
    galleryPreview.appendChild(div);
    lucide.createIcons();
}

window.removeGalleryItem = (isNew, index) => {
    if (isNew) { selectedGalleryFiles.splice(index, 1); }
    else { existingGalleryUrls.splice(index, 1); }
    refreshGalleryPreview();
};

function refreshGalleryPreview() {
    galleryPreview.innerHTML = "";
    existingGalleryUrls.forEach((url, i) => renderGalleryItem(url, false, i));
    selectedGalleryFiles.forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = (e) => renderGalleryItem(e.target.result, true, i);
        reader.readAsDataURL(file);
    });
}

async function loadNews() {
  tableBody.innerHTML = "<tr><td colspan='4' class='p-10 text-center text-gray-300 italic'>Memuat Berita...</td></tr>";
  const q = query(collection(db, "news"), orderBy("date", "desc"));
  const snap = await getDocs(q);
  tableBody.innerHTML = "";
  if (snap.empty) { tableBody.innerHTML = "<tr><td colspan='4' class='p-10 text-center text-gray-400'>Belum Ada Berita.</td></tr>"; return; }
  snap.forEach(d => {
    const item = d.data();
    const tr = document.createElement('tr');
    tr.className = "border-b hover:bg-purple-pale/10 transition-all";
    tr.innerHTML = `
      <td class="p-4 font-semibold text-purple-deep text-sm">${item.title}</td>
      <td class="p-4 text-center"><span class="px-2 py-1 bg-purple-pale text-purple-med text-[10px] rounded-lg font-black uppercase italic">${item.category}</span></td>
      <td class="p-4 text-center text-gray-400 text-xs">${item.date}</td>
      <td class="p-4 text-right space-x-3">
        <button class="edit-btn text-purple-med font-black text-[10px] uppercase hover:underline">Edit</button>
        <button class="delete-btn text-red-500 font-black text-[10px] uppercase hover:underline">Hapus</button>
      </td>
    `;
    tr.querySelector('.edit-btn').onclick = () => window.editNews(d.id);
    tr.querySelector('.delete-btn').onclick = () => window.deleteNews(d.id);
    tableBody.appendChild(tr);
  });
}

window.editNews = async (id) => {
  const snap = await getDoc(doc(db, "news", id));
  if (!snap.exists()) return;
  const item = snap.data();
  showView('form');
  document.getElementById('view-title').innerText = 'Edit Berita';
  editIdInput.value = id;
  document.getElementById('news-title').value = item.title || "";
  document.getElementById('news-category').value = item.category || "Kegiatan";
  document.getElementById('news-date').value = item.date || "";
  document.getElementById('news-author').value = item.author || "";
  document.getElementById('news-department').value = item.department || "Sekretaris Umum";
  quill.root.innerHTML = item.contentBody || "";
  imageInput.value = item.featuredImage || "";
  imagePreview.src = item.featuredImage || "";
  imagePreview.classList.toggle('hidden', !item.featuredImage);
  existingGalleryUrls = item.gallery || [];
  refreshGalleryPreview();
};

window.deleteNews = async (id) => {
  if (confirm("Hapus berita ini?")) { await deleteDoc(doc(db, "news", id)); loadNews(); }
};

document.getElementById('logout-btn').onclick = () => signOut(auth);

newsForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.innerText = "SEDANG MENYIMPAN...";

    try {
    let featuredImage = imageInput.value;
    
    // 1. Upload Main Image if needed
    if (imageMode.value === 'upload' && fileInput.files[0]) {
      const refImg = ref(storage, `news/${Date.now()}_main`);
      const snapImg = await uploadBytes(refImg, fileInput.files[0]);
      featuredImage = await getDownloadURL(snapImg.ref);
    }

    // 2. Upload Gallery Images in Parallel (Much Faster)
    const galleryUploadPromises = selectedGalleryFiles.map(async (file) => {
        const refGal = ref(storage, `news/${Date.now()}_gal_${Math.random().toString(36).substring(7)}`);
        const snapGal = await uploadBytes(refGal, file);
        return await getDownloadURL(snapGal.ref);
    });
    
    const newGalleryUrls = await Promise.all(galleryUploadPromises);
    const finalGallery = [...existingGalleryUrls, ...newGalleryUrls];

    const data = {
      title: document.getElementById('news-title').value,
      category: document.getElementById('news-category').value,
      date: document.getElementById('news-date').value,
      author: document.getElementById('news-author').value,
      department: document.getElementById('news-department').value,
      contentBody: quill.root.innerHTML,
      featuredImage: featuredImage,
      gallery: finalGallery,
      updatedAt: serverTimestamp()
    };

    if (editIdInput.value) {
      await updateDoc(doc(db, "news", editIdInput.value), data);
    } else {
      data.createdAt = serverTimestamp();
      const slugBase = data.title.toLowerCase().trim().replace(/ /g, '-').replace(/[^\w-]+/g, '');
      const uniqueSlug = `${slugBase}-${Date.now().toString().slice(-4)}`;
      await setDoc(doc(db, "news", uniqueSlug), data);
    }

    alert("Berita Berhasil Disimpan!");
    showView('list');
  } catch (err) {
    console.error(err);
    alert("Gagal menyimpan: " + err.message);
  } finally {
    btn.disabled = false; 
    btn.innerText = "SIMPAN BERITA";
  }
});
</script>
</body>
</html>
