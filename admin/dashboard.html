<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - BEM FAI UNSIKA</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            purple: {
              deep: '#2D1B4E',
              med: '#5B3A8C',
              light: '#9B72CF',
              soft: '#D4BEF0',
              pale: '#F3ECFA'
            }
          }
        }
      }
    }
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

    <!-- Quill Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

    <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FDFBFF;
    }

    /* Glass Sidebar */
    .sidebar {
      position: fixed;
      left: 20px;
      top: 20px;
      bottom: 20px;
      width: 280px;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 40px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px rgba(45,27,78,0.1);
      z-index: 50;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: 18px;
      font-weight: 600;
      color: #2D1B4E;
      transition: 0.3s;
      width: 100%;
      text-align: left;
    }

    .sidebar-link:hover {
      background: rgba(255,255,255,0.6);
      transform: translateX(6px);
    }

    .main {
  margin-left: 320px;
}

@media (max-width: 768px) {
  .main {
    margin-left: 0;
    padding-top: 80px;
  }
}

    /* Drop Area */
    .drop-area {
      border: 2px dashed #9B72CF;
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .drop-area:hover { background: #F3ECFA; }

    .image-preview-box {
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px;
    }
    
    .ql-editor {
      min-height: 150px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    .ql-container.ql-snow { border: none !important; }
    .ql-toolbar.ql-snow { border: none !important; border-bottom: 1px solid #f3f4f6 !important; }

    @media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
  }

  .sidebar.show {
    transform: translateX(0);
  }
}

  /* Bottom bar hidden state */
  .bottom-bar {
    transition: transform 0.3s ease-in-out;
  }
  .bottom-bar.hide {
    transform: translateY(100%);
  }


    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar fixed -translate-x-full md:translate-x-0 transition-transform duration-300">
  <div class="text-center mb-10">
    <img src="../assets/Logo/logo-bem.png" class="w-20 h-20 mx-auto rounded-3xl shadow-lg mb-3">
    <div class="font-black text-purple-900 leading-tight">BEM FAI UNSIKA</div>
    <div class="text-[10px] tracking-widest text-purple-600 mt-1 uppercase font-bold text-center">Poros Katalist</div>
  </div>

  <nav class="flex flex-col gap-2 flex-1">
    <button onclick="showView('list')" class="sidebar-link">
      <i data-lucide="layout-grid"></i> Kelola Berita
    </button>
    <button onclick="showView('form')" class="sidebar-link">
      <i data-lucide="plus-circle"></i> Tulis Berita
    </button>
    <button id="logout-btn" class="sidebar-link text-red-500 mt-auto">
      <i data-lucide="log-out"></i> Keluar
    </button>
  </nav>
</aside>

<!-- MOBILE BOTTOM BAR -->
<nav id="mobileBottomBar"
  class="bottom-bar fixed bottom-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-lg shadow-lg border-t md:hidden">

  <div class="flex justify-around items-center py-2 text-gray-600 text-xs">

      <!-- Home -->
      <button class="flex flex-col items-center">
          <i data-lucide="home"></i>
          <span>Home</span>
      </button>

      <!-- Kelola Berita -->
      <button class="flex flex-col items-center">
          <i data-lucide="layout-grid"></i>
          <span>Kelola</span>
      </button>

      <!-- Tulis Berita (FAB) -->
      <button class="relative -mt-6 bg-purple-500 text-white p-4 rounded-full shadow-lg">
          <i data-lucide="plus-circle"></i>
      </button>

      <!-- Users -->
      <button class="flex flex-col items-center">
          <i data-lucide="users"></i>
          <span>Users</span>
      </button>

      <!-- Logout -->
      <button id="logoutBtn" class="flex flex-col items-center text-red-600">
          <i data-lucide="log-out"></i>
          <span>Logout</span>
      </button>

  </div>
</nav>

<!-- LOGOUT MODAL -->
<div id="logoutModal"
  class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-[60]">

  <div class="bg-white p-5 rounded-xl shadow-xl w-64 text-center">
      <h2 class="font-semibold text-lg mb-3">Yakin ingin keluar?</h2>

      <div class="flex justify-around mt-4">
          <button id="cancelLogout"
            class="px-4 py-2 bg-gray-200 rounded-lg">
            Batal
          </button>

          <button id="confirmLogout"
            class="px-4 py-2 bg-red-500 text-white rounded-lg">
            Keluar
          </button>
      </div>
  </div>
</div>

<!-- FLOATING HAMBURGER -->
<button 
  id="menu-btn" 
  class="md:hidden fixed top-4 left-4 z-50 p-3 rounded-2xl bg-white/20 backdrop-blur-xl text-purple-deep shadow-lg border border-white/20"
>
  <i data-lucide="menu"></i>
</button>

<!-- OVERLAY -->
<div id="overlay" class="hidden fixed inset-0 bg-black/40 z-40 md:hidden"></div>

<!-- MAIN CONTENT -->
<main class="main p-8 pb-24">
  <div class="mb-8">
    <h1 id="view-title" class="text-2xl font-bold text-purple-900">Kelola Berita</h1>
    <p id="view-subtitle" class="text-gray-500 text-sm">Dashboard administrasi berita</p>
  </div>

  <!-- LIST VIEW -->
  <div id="view-list">
    <div class="bg-white rounded-2xl shadow p-4 overflow-hidden border border-purple-pale">
      <table class="w-full text-sm">
        <thead class="text-gray-400 border-b">
          <tr>
            <th class="text-left p-3">Judul Berita</th>
            <th class="text-center">Kategori</th>
            <th class="text-center">Tanggal</th>
            <th class="text-right p-3">Aksi</th>
          </tr>
        </thead>
        <tbody id="news-table-body" class="divide-y divide-gray-50"></tbody>
      </table>
    </div>
  </div>

  <!-- FORM VIEW -->
  <div id="view-form" class="hidden">
    <form id="news-form" class="max-w-4xl bg-white p-8 rounded-3xl shadow-xl space-y-8 border border-purple-pale">
      <input type="hidden" id="edit-id">

      <!-- 1. JUDUL BERITA -->
      <div class="space-y-2">
          <label class="text-sm font-bold text-purple-deep">Judul Berita</label>
          <input id="news-title" required placeholder="Masukkan judul berita..." class="w-full p-4 bg-gray-50 border border-purple-pale rounded-2xl outline-none focus:ring-2 focus:ring-purple-light/20">
      </div>

      <!-- 2. KATEGORI | TANGGAL -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
              <label class="text-sm font-bold text-purple-deep">Kategori</label>
              <select id="news-category" class="w-full p-4 bg-gray-50 border border-purple-pale rounded-2xl outline-none">
                  <option>Kegiatan</option>
                  <option>Sosial</option>
                  <option>Pelatihan</option>
                  <option>Pendidikan</option>
                  <option>Kajian</option>
              </select>
          </div>
          <div class="space-y-2">
              <label class="text-sm font-bold text-purple-deep">Tanggal</label>
              <input type="date" id="news-date" required class="w-full p-4 bg-gray-50 border border-purple-pale rounded-2xl outline-none">
          </div>
      </div>

      <!-- 3. PENULIS | DEPARTEMEN -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
              <label class="text-sm font-bold text-purple-deep">Penulis</label>
              <input id="news-author" placeholder="Nama Penulis" required class="w-full p-4 bg-gray-50 border border-purple-pale rounded-2xl outline-none">
          </div>
          <div class="space-y-2">
              <label class="text-sm font-bold text-purple-deep">Departemen</label>
              <select id="news-department" class="w-full p-4 bg-gray-50 border border-purple-pale rounded-2xl outline-none">
                  <option>Pengurus Inti BEM FAI</option>
                  <option>Staf Pengurus</option>
                  <option>PSDM</option>
                  <option>Kearsipan</option>
                  <option>MINBA</option>
                  <option>PENDAG</option>
                  <option>KASTRAT</option>
                  <option>ADKESMA</option>
                  <option>PENGMAS</option>
                  <option>Kemitraan</option>
                  <option>Media IT</option>
                  <option>EKRAF</option>
              </select>
          </div>
      </div>

      <!-- 4. GAMBAR UTAMA -->
      <div class="border-2 border-purple-pale rounded-3xl p-6 bg-purple-pale/5 space-y-4">
        <div class="flex items-center justify-between">
          <p class="font-bold text-purple-deep flex items-center gap-2">
            <i data-lucide="image" class="w-4 h-4"></i> Gambar Utama
          </p>
          <select id="image-mode" class="text-[10px] bg-white border border-purple-pale rounded-lg p-2 font-black uppercase text-purple-med">
            <option value="url">Gunakan URL</option>
            <option value="upload">Upload File</option>
          </select>
        </div>
        <div id="url-input-group">
          <input id="news-image" placeholder="Paste URL Gambar di sini..." class="w-full p-4 bg-white border border-purple-pale rounded-2xl outline-none">
        </div>
        <div id="upload-input-group" class="hidden">
          <input type="file" id="news-file" accept="image/*" class="hidden">
          <div id="main-drop-area" class="drop-area text-sm text-gray-400 py-10">
            Drag & Drop atau Klik untuk Upload Gambar Utama
          </div>
        </div>
        <img id="image-preview" class="hidden w-full border border-purple-pale bg-white image-preview-box">
      </div>

      <!-- 5. KONTEN BERITA 1 -->
      <div class="space-y-2">
          <label class="text-sm font-bold text-purple-deep">Konten Berita 1</label>
          <div id="editor-1" class="bg-gray-50 border border-purple-pale rounded-2xl overflow-hidden"></div>
      </div>

      <!-- 6. SUB JUDUL BERITA -->
      <div class="space-y-2 p-6 bg-purple-pale/10 rounded-2xl border border-purple-pale">
          <label class="text-sm font-bold text-purple-deep">Sub Judul Berita</label>
          <div id="editor-sub" class="bg-white border rounded-xl overflow-hidden shadow-sm"></div>
      </div>

      <!-- 7. KONTEN BERITA 2 -->
      <div class="space-y-2">
          <label class="text-sm font-bold text-purple-deep">Konten Berita 2</label>
          <div id="editor-2" class="bg-gray-50 border border-purple-pale rounded-2xl overflow-hidden"></div>
      </div>

      <!-- 8. KUTIPAN -->
      <div class="space-y-2 bg-gray-50 p-6 rounded-2xl border border-purple-pale italic">
          <label class="text-sm font-bold text-purple-deep not-italic">Kutipan</label>
          <textarea id="news-quotes" rows="3" placeholder="Masukkan kutipan atau kata-kata bijak..." class="w-full p-4 bg-white border border-purple-pale rounded-xl outline-none"></textarea>
      </div>

      <!-- 9. KONTEN BERITA 3 -->
      <div class="space-y-2">
          <label class="text-sm font-bold text-purple-deep">Konten Berita 3</label>
          <div id="editor-3" class="bg-gray-50 border border-purple-pale rounded-2xl overflow-hidden"></div>
      </div>

      <!-- 10. TAGAR -->
      <div class="space-y-2">
          <label class="text-sm font-bold text-purple-deep">Tagar (Hashtags)</label>
          <input id="news-hashtags" placeholder="#BEMFAI #UNSIKA #POROSKATALIST" class="w-full p-4 bg-gray-50 border border-purple-pale rounded-2xl outline-none">
      </div>

      <!-- 11. GALERI KEGIATAN -->
      <div class="border-2 border-purple-pale rounded-3xl p-8 bg-gray-50 space-y-6">
          <div class="flex items-center justify-between">
              <p class="font-bold text-purple-deep flex items-center gap-2 italic text-lg">
                  <i data-lucide="images" class="w-6 h-6"></i> Galeri Dokumentasi
                  <span class="text-[10px] text-gray-400 font-normal ml-2 tracking-widest">(MAKSIMAL 8 FOTO)</span>
              </p>
              <div class="flex gap-2">
                  <button type="button" onclick="addGalleryUrl()" class="text-[10px] bg-white border border-purple-pale text-purple-med px-4 py-2 rounded-xl font-bold uppercase">Tambah via URL</button>
                  <button type="button" onclick="document.getElementById('gallery-files').click()" class="text-[10px] bg-purple-med text-white px-4 py-2 rounded-xl font-bold uppercase">Upload File</button>
              </div>
          </div>
          
          <input type="file" id="gallery-files" accept="image/*" multiple class="hidden">
          
          <div id="gallery-preview" class="grid grid-cols-2 md:grid-cols-4 gap-4 min-h-[100px] border-2 border-dashed border-purple-pale/20 rounded-2xl p-4">
              <!-- Grid Galeri -->
          </div>
      </div>

      <!-- BUTTONS -->
      <div class="flex justify-end gap-3 pt-8 border-t border-purple-pale/30">
        <button type="button" onclick="showView('list')" class="px-8 py-3 text-gray-500 font-bold hover:text-purple-deep transition-colors">Batal</button>
        <button id="save-btn" class="px-12 py-4 bg-purple-med text-white rounded-2xl font-black shadow-2xl shadow-purple-med/30 hover:-translate-y-1 hover:bg-purple-deep transition-all uppercase tracking-widest text-xs">
          Simpan Berita
        </button>
      </div>
    </form>
  </div>
</main>

<script type="module">
import {
  auth, db, storage, ref, uploadBytes, getDownloadURL,
  collection, addDoc, updateDoc, deleteDoc, setDoc,
  doc, getDocs, getDoc,
  query, orderBy,
  serverTimestamp,
  onAuthStateChanged,
  signOut
} from '../js/firebase-init.js';

lucide.createIcons();

// --- Konfigurasi Quill Editor ---

// Toolbar terbatas (Normal & H2)
const limitedToolbar = [
  [{ header: [2, false] }],
  ['bold', 'italic', 'underline'],
  ['link', 'blockquote'],
  [{ list: 'ordered' }, { list: 'bullet' }],
  ['clean']
];

// Toolbar Sub Judul
const subToolbar = [
  [{ header: 2 }],
  ['bold', 'italic', 'underline'],
  ['link'],
  ['clean']
];

const q1 = new Quill('#editor-1', { theme: 'snow', placeholder: 'Isi bagian 1...', modules: { toolbar: limitedToolbar } });
const q2 = new Quill('#editor-2', { theme: 'snow', placeholder: 'Isi bagian 2...', modules: { toolbar: limitedToolbar } });
const q3 = new Quill('#editor-3', { theme: 'snow', placeholder: 'Isi bagian 3...', modules: { toolbar: limitedToolbar } });
const qSub = new Quill('#editor-sub', { theme: 'snow', placeholder: 'Tulis sub judul...', modules: { toolbar: subToolbar } });

// --- Variabel & Elements ---

const viewList = document.getElementById('view-list');
const viewForm = document.getElementById('view-form');
const tableBody = document.getElementById('news-table-body');
const newsForm = document.getElementById('news-form');
const editIdInput = document.getElementById('edit-id');

const imageMode = document.getElementById('image-mode');
const imageInput = document.getElementById('news-image');
const fileInput = document.getElementById('news-file');
const imagePreview = document.getElementById('image-preview');
const mainDropArea = document.getElementById('main-drop-area');

const galleryFiles = document.getElementById('gallery-files');
const galleryPreview = document.getElementById('gallery-preview');

let selectedGalleryFiles = []; // Array of {file, id}
let galleryUrls = []; // Array of strings

onAuthStateChanged(auth, (user) => {
  if (!user) { location.href = "login.html"; return; }
  loadNews();
});

// --- View State ---

window.showView = (view) => {
  viewList.classList.toggle('hidden', view !== 'list');
  viewForm.classList.toggle('hidden', view !== 'form');

  if (view === 'form') {
    newsForm.reset();
    editIdInput.value = "";
    q1.root.innerHTML = "";
    q2.root.innerHTML = "";
    q3.root.innerHTML = "";
    qSub.root.innerHTML = "";
    imagePreview.classList.add('hidden');
    galleryPreview.innerHTML = "";
    selectedGalleryFiles = [];
    galleryUrls = [];
    document.getElementById('view-title').innerText = 'Tulis Berita';
  } else {
    document.getElementById('view-title').innerText = 'Kelola Berita';
    loadNews();
  }
};

// --- Gambar Utama ---

imageMode.addEventListener('change', () => {
  document.getElementById('url-input-group').classList.toggle('hidden', imageMode.value !== 'url');
  document.getElementById('upload-input-group').classList.toggle('hidden', imageMode.value === 'url');
});

imageInput.addEventListener('input', () => {
  if (imageInput.value) { imagePreview.src = imageInput.value; imagePreview.classList.remove('hidden'); }
  else { imagePreview.classList.add('hidden'); }
});

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => { imagePreview.src = e.target.result; imagePreview.classList.remove('hidden'); };
    reader.readAsDataURL(file);
  }
});

mainDropArea.addEventListener('click', () => fileInput.click());
mainDropArea.addEventListener('dragover', (e) => { e.preventDefault(); mainDropArea.classList.add('bg-purple-pale/20'); });
mainDropArea.addEventListener('dragleave', () => mainDropArea.classList.remove('bg-purple-pale/20'));
mainDropArea.addEventListener('drop', (e) => {
  e.preventDefault();
  mainDropArea.classList.remove('bg-purple-pale/20');
  fileInput.files = e.dataTransfer.files;
  fileInput.dispatchEvent(new Event('change'));
});

// --- Galeri (Maksimal 8) ---

window.addGalleryUrl = () => {
    const url = prompt("Masukkan URL Gambar Dokumentasi:");
    if (url && (galleryUrls.length + selectedGalleryFiles.length) < 8) {
        galleryUrls.push(url);
        renderGallery();
    } else if (url) {
        alert("Batas Maksimal 8 Foto!");
    }
};

galleryFiles.addEventListener('change', () => {
    const files = Array.from(galleryFiles.files);
    files.forEach(file => {
        if ((galleryUrls.length + selectedGalleryFiles.length) < 8) {
            selectedGalleryFiles.push({ file, id: Date.now() + Math.random() });
        }
    });
    renderGallery();
    galleryFiles.value = ""; // reset
});

async function renderGallery() {
    galleryPreview.innerHTML = "";
    
    // Render existing URLs
    galleryUrls.forEach((url, index) => {
        const item = createGalleryEl(url, () => {
            galleryUrls.splice(index, 1);
            renderGallery();
        });
        galleryPreview.appendChild(item);
    });

    // Render new local files
    for (const itemObj of selectedGalleryFiles) {
        const reader = new FileReader();
        const item = createGalleryEl("", () => {
            selectedGalleryFiles = selectedGalleryFiles.filter(i => i.id !== itemObj.id);
            renderGallery();
        });
        galleryPreview.appendChild(item);
        
        reader.onload = (e) => { 
            item.querySelector('img').src = e.target.result;
        };
        reader.readAsDataURL(itemObj.file);
    }
    lucide.createIcons();
}

function createGalleryEl(src, onRemove) {
    const div = document.createElement('div');
    div.className = "relative group aspect-square rounded-xl overflow-hidden border border-purple-pale shadow-sm";
    div.innerHTML = `
        <img src="${src}" class="w-full h-full object-cover">
        <button type="button" class="absolute top-1 right-1 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
            <i data-lucide="x" class="w-3 h-3"></i>
        </button>
    `;
    div.querySelector('button').onclick = onRemove;
    return div;
}

// --- Operasi Data ---

async function loadNews() {
  tableBody.innerHTML = "<tr><td colspan='4' class='p-10 text-center text-gray-300 italic'>Memuat Berita...</td></tr>";
  const q = query(collection(db, "news"), orderBy("date", "desc"));
  const snap = await getDocs(q);
  tableBody.innerHTML = "";
  
  if (snap.empty) { 
      tableBody.innerHTML = "<tr><td colspan='4' class='p-10 text-center text-gray-400'>Belum Ada Berita.</td></tr>"; 
      return; 
  }
  
  snap.forEach(d => {
    const item = d.data();
    const tr = document.createElement('tr');
    tr.className = "border-b hover:bg-purple-pale/10 transition-all";
    tr.innerHTML = `
      <td class="p-4 font-semibold text-purple-deep text-sm">${item.title}</td>
      <td class="p-4 text-center"><span class="px-2 py-1 bg-purple-pale text-purple-med text-[10px] rounded-lg font-black uppercase italic">${item.category}</span></td>
      <td class="p-4 text-center text-gray-400 text-xs">${item.date}</td>
      <td class="p-4 text-right space-x-3">
        <button class="edit-btn text-purple-med font-black text-[10px] uppercase hover:underline">Edit</button>
        <button class="delete-btn text-red-500 font-black text-[10px] uppercase hover:underline">Hapus</button>
      </td>
    `;
    tr.querySelector('.edit-btn').onclick = () => editNews(d.id);
    tr.querySelector('.delete-btn').onclick = () => deleteNews(d.id);
    tableBody.appendChild(tr);
  });
}

async function editNews(id) {
  const snap = await getDoc(doc(db, "news", id));
  if (!snap.exists()) return;
  const item = snap.data();
  
  showView('form');
  editIdInput.value = id;
  
  document.getElementById('news-title').value = item.title || "";
  document.getElementById('news-category').value = item.category || "Kegiatan";
  document.getElementById('news-date').value = item.date || "";
  document.getElementById('news-author').value = item.author || "";
  document.getElementById('news-department').value = item.department || "Pengurus Inti BEM FAI";
  document.getElementById('news-hashtags').value = item.hashtags || "";
  document.getElementById('news-quotes').value = item.quotes || "";
  
  q1.root.innerHTML = item.content1 || "";
  q2.root.innerHTML = item.content2 || "";
  q3.root.innerHTML = item.content3 || "";
  qSub.root.innerHTML = item.subTitle || "";
  
  imageInput.value = item.featuredImage || "";
  imagePreview.src = item.featuredImage || "";
  imagePreview.classList.toggle('hidden', !item.featuredImage);
  
  galleryUrls = item.gallery || [];
  renderGallery();
}

async function deleteNews(id) {
  if (confirm("Hapus berita ini?")) { await deleteDoc(doc(db, "news", id)); loadNews(); }
}

document.getElementById('logout-btn').onclick = () => signOut(auth);

newsForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.innerText = "SEDANG MENYIMPAN...";

  try {
    let featuredImage = imageInput.value;
    if (imageMode.value === 'upload' && fileInput.files[0]) {
      const refImg = ref(storage, `news/${Date.now()}_main`);
      const snapImg = await uploadBytes(refImg, fileInput.files[0]);
      featuredImage = await getDownloadURL(snapImg.ref);
    }

    // Upload gallery files
    const finalGallery = [...galleryUrls];
    const uploadPromises = selectedGalleryFiles.map(async (item) => {
        const refGal = ref(storage, `news/gal_${Date.now()}_${Math.random().toString(36).substring(7)}`);
        const snapGal = await uploadBytes(refGal, item.file);
        return await getDownloadURL(snapGal.ref);
    });
    
    const uploadedUrls = await Promise.all(uploadPromises);
    finalGallery.push(...uploadedUrls);

    // Legacy support for contentBody
    const fullBody = q1.root.innerHTML + qSub.root.innerHTML + q2.root.innerHTML + (document.getElementById('news-quotes').value ? `<blockquote>${document.getElementById('news-quotes').value}</blockquote>` : "") + q3.root.innerHTML;

    const data = {
      title: document.getElementById('news-title').value,
      category: document.getElementById('news-category').value,
      date: document.getElementById('news-date').value,
      author: document.getElementById('news-author').value,
      department: document.getElementById('news-department').value,
      content1: q1.root.innerHTML,
      subTitle: qSub.root.innerHTML,
      content2: q2.root.innerHTML,
      quotes: document.getElementById('news-quotes').value,
      content3: q3.root.innerHTML,
      hashtags: document.getElementById('news-hashtags').value,
      contentBody: fullBody, // keeping body for homepage compatibility
      featuredImage: featuredImage,
      gallery: finalGallery,
      updatedAt: serverTimestamp()
    };

    if (editIdInput.value) {
      await updateDoc(doc(db, "news", editIdInput.value), data);
    } else {
      data.createdAt = serverTimestamp();
      const slug = data.title.toLowerCase().trim().replace(/ /g, '-').replace(/[^\w-]+/g, '') + '-' + Date.now().toString().slice(-4);
      await setDoc(doc(db, "news", slug), data);
    }

    alert("Berita Berhasil Disimpan!");
    showView('list');
  } catch (err) {
    alert("Error: " + err.message);
  } finally {
    btn.disabled = false; btn.innerText = "SIMPAN BERITA";
  }
});

  // Auto hide bottom bar on scroll

  const bar = document.getElementById('mobileBottomBar');

  window.addEventListener('scroll', () => {
      let current = window.scrollY;

      if (current > lastScroll) {
          bar.classList.add('hide'); // Scroll bawah → hilang
      } else {
          bar.classList.remove('hide'); // Scroll atas → muncul
      }
