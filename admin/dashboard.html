<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin - BEM FAI UNSIKA</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Tailwind Config (AMAN - tidak ganggu Firebase) -->
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        purple: {
          deep: '#2D1B4E',
          med: '#5B3A8C',
          light: '#9B72CF',
          soft: '#D4BEF0',
          pale: '#F3ECFA'
        }
      }
    }
  }
}
</script>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Icons -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<style>
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
}

/* Glass Sidebar */
.sidebar {
  position: fixed;
  left: 20px;
  top: 20px;
  bottom: 20px;
  width: 280px;
  background: rgba(255,255,255,0.4);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 40px;
  padding: 30px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 50px rgba(45,27,78,0.1);
  z-index: 50;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-radius: 18px;
  font-weight: 600;
  color: #2D1B4E;
  transition: 0.3s;
}

.sidebar-link:hover {
  background: rgba(255,255,255,0.6);
  transform: translateX(6px);
}

.main {
  margin-left: 320px;
}
</style>

</head>

<body class="bg-[#FDFBFF]">

<!-- SIDEBAR -->
<aside class="sidebar">

  <!-- Logo -->
  <div class="text-center mb-10">
    <img src="../assets/Logo/logo-bem.png"
         class="w-20 h-20 mx-auto rounded-3xl shadow-lg mb-3">
    <div class="font-black text-purple-900">BEM FAI UNSIKA</div>
    <div class="text-xs tracking-widest text-purple-600">Lord Sumanto</div>
  </div>

  <!-- MENU -->
  <nav class="flex flex-col gap-2 flex-1">

    <button onclick="showView('list')" class="sidebar-link">
      <i data-lucide="layout-grid"></i> Kelola Berita
    </button>

    <button onclick="showView('form')" class="sidebar-link">
      <i data-lucide="plus-circle"></i> Tulis Berita
    </button>

    <button id="logout-btn"
      class="sidebar-link text-red-500 mt-auto">
      <i data-lucide="log-out"></i> Keluar
    </button>

  </nav>

</aside>

<!-- MAIN CONTENT -->
<main class="main p-8">

<!-- HEADER -->
<div class="mb-8">
  <h1 id="view-title" class="text-2xl font-bold text-purple-900">
    Kelola Berita
  </h1>
  <p id="view-subtitle" class="text-gray-500 text-sm">
    Dashboard administrasi berita
  </p>
</div>

<!-- LIST VIEW -->
<div id="view-list">

  <div class="bg-white rounded-2xl shadow p-4">
    <table class="w-full text-sm">
      <thead class="text-gray-400 border-b">
        <tr>
          <th class="text-left p-3">Judul</th>
          <th>Kategori</th>
          <th>Tanggal</th>
          <th class="text-right">Aksi</th>
        </tr>
      </thead>

      <tbody id="news-table-body"></tbody>

    </table>
  </div>

</div>

<!-- FORM VIEW -->
<div id="view-form" class="hidden max-w-3xl">

  <form id="news-form" class="bg-white p-6 rounded-2xl shadow space-y-4">

    <input type="hidden" id="edit-id">

    <input id="news-title" placeholder="Judul"
      class="w-full p-3 border rounded-xl">

    <select id="news-category"
      class="w-full p-3 border rounded-xl">
      <option>Kegiatan</option>
      <option>Sosial</option>
      <option>Pelatihan</option>
      <option>Pendidikan</option>
      <option>Kajian</option>
    </select>

    <input id="news-author" placeholder="Penulis"
      class="w-full p-3 border rounded-xl">

    <input type="date" id="news-date"
      class="w-full p-3 border rounded-xl">

    <textarea id="news-content"
      class="w-full p-3 border rounded-xl"
      rows="6"></textarea>

    <input id="news-image"
      placeholder="URL gambar"
      class="w-full p-3 border rounded-xl">

    <div class="flex justify-end gap-3">
      <button type="button"
        onclick="showView('list')"
        class="px-4 py-2 text-gray-500">
        Batal
      </button>

      <button id="save-btn"
        class="px-5 py-2 bg-purple-600 text-white rounded-xl">
        Simpan
      </button>
    </div>

  </form>

</div>

</main>

<!-- FIREBASE SAFE SCRIPT -->
<script type="module">

import {
  auth, db,
  collection, addDoc, updateDoc, deleteDoc,
  doc, getDocs, query, orderBy,
  serverTimestamp,
  onAuthStateChanged,
  signOut
} from '../js/firebase-init.js';

lucide.createIcons();

/* AUTH SAFE */
onAuthStateChanged(auth, (user) => {
  if (!user) location.href = "login.html";
  loadNews();
});

/* VIEW SWITCH (SAFE) */
window.showView = (v) => {
  document.getElementById('view-list').classList.add('hidden');
  document.getElementById('view-form').classList.add('hidden');

  document.getElementById('news-form').reset();
  document.getElementById('edit-id').value = "";

  if (v === 'list') {
    document.getElementById('view-list').classList.remove('hidden');
  }

  if (v === 'form') {
    document.getElementById('view-form').classList.remove('hidden');
  }
};

/* LOAD DATA */
async function loadNews() {
  const table = document.getElementById('news-table-body');
  table.innerHTML = "";

  const q = query(collection(db, 'news'), orderBy('date','desc'));
  const snap = await getDocs(q);

  snap.forEach(d => {
    const item = d.data();

    table.innerHTML += `
      <tr class="border-b">
        <td class="p-3">${item.title}</td>
        <td>${item.category}</td>
        <td>${item.date}</td>
        <td class="text-right p-3">
          <button onclick="editNews('${d.id}')">Edit</button>
          <button onclick="deleteNews('${d.id}')" class="text-red-500">Hapus</button>
        </td>
      </tr>
    `;
  });
}

/* SAVE */
document.getElementById('news-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const id = document.getElementById('edit-id').value;

  const data = {
    title: news-title.value,
    category: news-category.value,
    author: news-author.value,
    date: news-date.value,
    contentBody: news-content.value,
    featuredImage: news-image.value,
    updatedAt: serverTimestamp()
  };

  if (id) {
    await updateDoc(doc(db,'news',id), data);
  } else {
    data.createdAt = serverTimestamp();
    await addDoc(collection(db,'news'), data);
  }

  showView('list');
  loadNews();
});

/* EDIT SAFE FIXED */
window.editNews = async (id) => {
  try {
    const snap = await getDocs(collection(db, 'news'));
    const item = snap.docs.find(d => d.id === id)?.data();

    if (!item) return;

    showView('form');

    document.getElementById('edit-id').value = id;
    document.getElementById('news-title').value = item.title || '';
    document.getElementById('news-category').value = item.category || '';
    document.getElementById('news-author').value = item.author || '';
    document.getElementById('news-date').value = item.date || '';
    document.getElementById('news-content').value = item.contentBody || '';
    document.getElementById('news-image').value = item.featuredImage || '';

    // gallery (safe)
    const galleryInputs = document.querySelectorAll('.gallery-input');
    if (Array.isArray(item.gallery)) {
      item.gallery.forEach((url, i) => {
        if (galleryInputs[i]) galleryInputs[i].value = url;
      });
    }

  } catch (err) {
    console.error("Edit error:", err);
  }
};

/* DELETE SAFE */
window.deleteNews = async (id) => {
  if (confirm("Hapus?")) {
    await deleteDoc(doc(db,'news',id));
    loadNews();
  }
};

/* LOGOUT */
document.getElementById('logout-btn')
.addEventListener('click', () => signOut(auth));

</script>

</body>
</html>
