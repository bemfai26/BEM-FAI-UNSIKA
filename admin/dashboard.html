<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - BEM FAI UNSIKA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-purple-deep text-white hidden lg:block">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-10">
                <img src="../assets/Logo/logo-bem.png" class="w-10 h-10 rounded-full">
                <span class="font-bold text-sm tracking-wider uppercase">Admin BEM</span>
            </div>
            
            <nav class="space-y-2">
                <button onclick="showView('list')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all font-semibold text-sm">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i> Kelola Berita
                </button>
                <button onclick="showView('form')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/10 transition-all font-semibold text-sm">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Tulis Berita
                </button>
                <button id="logout-btn" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-500/10 text-red-400 transition-all font-semibold text-sm mt-20">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
                </button>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="lg:ml-64 p-6 lg:p-10">
        
        <!-- Header -->
        <header class="flex items-center justify-between mb-10">
            <div>
                <h1 id="view-title" class="text-2xl font-bold text-gray-800">Kelola Berita</h1>
                <p id="view-subtitle" class="text-sm text-gray-500">Daftar seluruh berita yang telah dipublikasikan</p>
            </div>
            <button onclick="showView('form')" class="px-6 py-3 bg-purple-med text-white font-bold rounded-xl hover:bg-purple-deep transition-all shadow-lg flex items-center gap-2 lg:hidden">
                <i data-lucide="plus" class="w-4 h-4"></i> Tulis
            </button>
        </header>

        <!-- List View -->
        <div id="view-list" class="space-y-4">
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b border-gray-100">
                            <tr>
                                <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Berita</th>
                                <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Kategori</th>
                                <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Tanggal</th>
                                <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="news-table-body" class="divide-y divide-gray-50 text-sm">
                            <!-- JS populated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Form View -->
        <div id="view-form" class="hidden max-w-4xl">
            <form id="news-form" class="bg-white rounded-3xl shadow-xl p-8 border border-gray-100 space-y-8">
                <input type="hidden" id="edit-id">
                
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-sm font-bold text-gray-700">Judul Berita</label>
                        <input type="text" id="news-title" required class="w-full px-5 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-purple-med/20 focus:border-purple-med outline-none">
                    </div>
                    <div class="space-y-4">
                        <label class="block text-sm font-bold text-gray-700">Kategori</label>
                        <select id="news-category" required class="w-full px-5 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-purple-med/20 focus:border-purple-med outline-none">
                            <option value="Kegiatan">Kegiatan</option>
                            <option value="Prestasi">Prestasi</option>
                            <option value="Informasi">Informasi</option>
                            <option value="Opini">Opini</option>
                        </select>
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <label class="block text-sm font-bold text-gray-700">Penulis / Departemen</label>
                        <input type="text" id="news-author" placeholder="Contoh: Departemen Kearsipan" required class="w-full px-5 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-purple-med/20 focus:border-purple-med outline-none">
                    </div>
                    <div class="space-y-4">
                        <label class="block text-sm font-bold text-gray-700">Tanggal</label>
                        <input type="date" id="news-date" required class="w-full px-5 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-purple-med/20 focus:border-purple-med outline-none">
                    </div>
                </div>

                <div class="space-y-4">
                    <label class="block text-sm font-bold text-gray-700">Isi Berita</label>
                    <textarea id="news-content" rows="10" required class="w-full px-5 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-purple-med/20 focus:border-purple-med outline-none" placeholder="Tuliskan berita lengkap di sini... (Mendukung tag HTML dasar)"></textarea>
                </div>

                <div class="space-y-4">
                    <label class="block text-sm font-bold text-gray-700">URL Foto Utama</label>
                    <input type="url" id="news-image" required placeholder="https://contoh.com/foto-utama.jpg" class="w-full px-5 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:ring-2 focus:ring-purple-med/20 focus:border-purple-med outline-none">
                </div>

                <div class="space-y-4">
                    <label class="block text-sm font-bold text-gray-700">Galeri Dokumentasi (4 URL Foto)</label>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="url" class="gallery-input w-full px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl" placeholder="URL Foto 1">
                        <input type="url" class="gallery-input w-full px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl" placeholder="URL Foto 2">
                        <input type="url" class="gallery-input w-full px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl" placeholder="URL Foto 3">
                        <input type="url" class="gallery-input w-full px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl" placeholder="URL Foto 4">
                    </div>
                </div>

                <div class="flex items-center justify-end gap-4 pt-6 border-t border-gray-100">
                    <button type="button" onclick="showView('list')" class="px-6 py-3 text-gray-400 font-bold hover:text-gray-600">Batal</button>
                    <button type="submit" id="save-btn" class="px-10 py-3 bg-purple-med text-white font-bold rounded-xl hover:bg-purple-deep transition-all shadow-lg flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Simpan Berita
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { auth, db, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, orderBy, serverTimestamp, onAuthStateChanged, signOut } from '../js/firebase-init.js';
        
        lucide.createIcons();

        // Auth Check
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
            loadNews();
        });

        // Global Navigation
        window.showView = (view) => {
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-form').classList.add('hidden');
            document.getElementById('edit-id').value = '';
            document.getElementById('news-form').reset();
            
            if (view === 'list') {
                document.getElementById('view-list').classList.remove('hidden');
                document.getElementById('view-title').innerText = 'Kelola Berita';
                document.getElementById('view-subtitle').innerText = 'Daftar seluruh berita yang telah dipublikasikan';
                loadNews();
            } else {
                document.getElementById('view-list').classList.add('hidden'); // Ensure forced
                document.getElementById('view-form').classList.remove('hidden');
                document.getElementById('view-title').innerText = 'Tulis Berita';
                document.getElementById('view-subtitle').innerText = 'Buat berita baru untuk website';
            }
        };

        // Form Submission
        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = 'Menyimpan...';

            const editId = document.getElementById('edit-id').value;
            const galleryInputs = document.querySelectorAll('.gallery-input');
            const gallery = Array.from(galleryInputs).map(input => input.value).filter(val => val !== '');

            const data = {
                title: document.getElementById('news-title').value,
                slug: document.getElementById('news-title').value.toLowerCase().replace(/ /g, '-').replace(/[^\w-]+/g, ''),
                category: document.getElementById('news-category').value,
                author: document.getElementById('news-author').value,
                date: document.getElementById('news-date').value,
                contentBody: document.getElementById('news-content').value,
                featuredImage: document.getElementById('news-image').value,
                gallery: gallery,
                updatedAt: serverTimestamp()
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, 'news', editId), data);
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, 'news'), data);
                }
                showView('list');
            } catch (error) {
                console.error(error);
                alert('Gagal menyimpan berita.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = 'Simpan Berita';
            }
        });

        // Load News List
        async function loadNews() {
            const tableBody = document.getElementById('news-table-body');
            tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-400">Memuat data...</td></tr>';

            const q = query(collection(db, 'news'), orderBy('date', 'desc'));
            const querySnapshot = await getDocs(q);
            
            tableBody.innerHTML = '';
            if (querySnapshot.empty) {
                tableBody.innerHTML = '<tr><td colspan="4" class="px-6 py-10 text-center text-gray-400">Belum ada berita.</td></tr>';
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50/50 transition-colors';
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-4">
                            <img src="${item.featuredImage}" class="w-12 h-10 rounded-xl object-cover">
                            <span class="font-bold text-gray-700">${item.title}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 bg-purple-pale text-purple-med text-[10px] font-bold rounded-full uppercase">${item.category}</span>
                    </td>
                    <td class="px-6 py-4 text-gray-500">${item.date}</td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="editNews('${docSnap.id}')" class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg transition-colors"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="deleteNews('${docSnap.id}')" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // Action Handlers
        window.editNews = async (id) => {
            const querySnapshot = await getDocs(collection(db, 'news'));
            const item = querySnapshot.docs.find(d => d.id === id).data();
            
            showView('form');
            document.getElementById('view-title').innerText = 'Edit Berita';
            document.getElementById('edit-id').value = id;
            document.getElementById('news-title').value = item.title;
            document.getElementById('news-category').value = item.category;
            document.getElementById('news-author').value = item.author;
            document.getElementById('news-date').value = item.date;
            document.getElementById('news-content').value = item.contentBody;
            document.getElementById('news-image').value = item.featuredImage;

            const galleryInputs = document.querySelectorAll('.gallery-input');
            item.gallery.forEach((url, i) => {
                if (galleryInputs[i]) galleryInputs[i].value = url;
            });
        };

        window.deleteNews = async (id) => {
            if (confirm('Apakah Anda yakin ingin menghapus berita ini?')) {
                await deleteDoc(doc(db, 'news', id));
                loadNews();
            }
        };

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
