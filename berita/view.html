<script type="module">

/* =========================================
   IMPORT FIREBASE
========================================= */
import {
    db,
    doc,
    getDoc,
    collection,
    getDocs,
    query,
    orderBy,
    limit
} from '../js/firebase-init.js';


/* =========================================
   FORMAT TANGGAL INDONESIA
========================================= */
function formatTanggal(dateString) {

    const bulanIndonesia = [
        "Januari", "Februari", "Maret", "April",
        "Mei", "Juni", "Juli", "Agustus",
        "September", "Oktober", "November", "Desember"
    ];

    const date = new Date(dateString);

    return `${date.getDate()} ${bulanIndonesia[date.getMonth()]} ${date.getFullYear()}`;
}


/* =========================================
   INIT HALAMAN
========================================= */
document.addEventListener('DOMContentLoaded', () => {

    // render lucide icon
    lucide.createIcons();

    // ambil parameter id dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const newsId = urlParams.get('id');

    // jika ada id -> load artikel
    if (newsId) {
        loadArticle(newsId);
    } else {
        // redirect jika tidak ada id
        window.location.href = 'home-berita.html';
    }

    // init semua component
    initNavbar();
    initScrollProgress();
    initCopyLink();
    initShareDropdown();
    initMobileMenu();
    initSearch();
});


/* =========================================
   LOAD ARTIKEL DARI FIREBASE
========================================= */
async function loadArticle(id) {

    try {

        const docRef = doc(db, 'news', id);
        const docSnap = await getDoc(docRef);

        // jika artikel ditemukan
        if (docSnap.exists()) {

            const data = docSnap.data();

            displayArticle(data);
            loadRelated(data.category, id);

        } else {

            // artikel tidak ditemukan
            document.getElementById('article-title').innerText =
                'Berita Tidak Ditemukan';

            document.getElementById('article-body').innerHTML = `
                <p class="text-center py-20 px-4 bg-red-50 rounded-2xl text-red-500 font-bold">
                    Maaf, berita yang anda cari tidak ada atau sudah dihapus.
                </p>
            `;

            document.getElementById('article-category').innerText = '404';

            document
                .getElementById('article-feature-image')
                .classList.add('hidden');
        }

    } catch (error) {

        console.error("Error loading article:", error);

        document.getElementById('article-title').innerText = 'Error';

        document.getElementById('article-body').innerHTML = `
            <p class="text-center py-20 text-red-500 font-bold">
                Gagal memuat berita: ${error.message}
            </p>
        `;
    }
}


/* =========================================
   DISPLAY ARTIKEL KE UI
========================================= */
function displayArticle(data) {

    // Nonaktifkan galeri agar tidak merender carousel lama
    data.gallery = [];

    // title browser
    document.title = `${data.title} - BEM FAI UNSIKA`;

    // split title biar aesthetic
    const titleParts = data.title.split(' ');
    const mainTitle = titleParts.slice(0, 3).join(' ');
    const subTitlePart = titleParts.slice(3).join(' ');

    // inject title
    document.getElementById('article-title').innerHTML = `
        ${mainTitle}

        ${subTitlePart ? `
        <span class="italic text-purple-med/70 font-light underline decoration-purple-soft/50 underline-offset-8">
            ${subTitlePart}
        </span>
        ` : ''}
    `;

    // category
    document.getElementById('article-category').innerText =
        data.category;

    // tanggal
    document.getElementById('article-date').innerHTML = `
        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
        ${formatTanggal(data.date)}
    `;

    // author & department
    document.getElementById('article-author').innerText = data.author;
    document.getElementById('article-department').innerText = data.department || "Pengurus BEM FAI";

    // --- HELPER UNTUK DROP CAP (Gambar 1) ---
    function applyDropCap(html) {
        if (!html) return '';
        const temp = document.createElement('div');
        temp.innerHTML = html;
        const firstP = temp.querySelector('p');
        if (firstP && firstP.textContent.trim().length > 0) {
            const rawText = firstP.textContent.trim();
            const firstChar = rawText.charAt(0);
            const restText = rawText.slice(1);
            // Bungkus huruf pertama dalam span khusus dengan ukuran lebih besar di mobile dan warna text-purple-deep (text-[2.75rem] md:text-5xl)
            firstP.innerHTML = `<span class="float-left text-[2.75rem] md:text-5xl font-bold text-purple-deep mr-3 leading-[0.85] font-display uppercase mt-1 drop-cap-style">${firstChar}</span>` + restText;
            return temp.innerHTML;
        }
        return html;
    }

    // --- STRUKTUR KONTEN BERITA BARU ---
    let fullBodyHtml = '';
    
    // Helper to render image blocks with perfectly uniform mb-10 spacing
    const renderImageBlock = (imgSrc, altText) => {
        if (imgSrc) {
            return `
                <div class="rounded-3xl overflow-hidden shadow-2xl mb-10 relative bg-purple-pale/20">
                    <img src="${imgSrc}" class="w-full h-auto max-h-[350px] sm:max-h-[420px] md:max-h-[500px] object-cover animate-fade-in" alt="${altText}">
                </div>
            `;
        }
        return '';
    };

    // 1. Konten Berita 1 (With Drop Cap)
    if (data.content1) {
        fullBodyHtml += `<div class="mb-10 text-gray-700 leading-relaxed text-lg font-alice">${applyDropCap(data.content1)}</div>`;
    }
    
    // 2. Sub Judul Berita (Clean Styling)
    if (data.subTitle && data.subTitle.replace(/<[^>]*>/g, '').trim() !== "") {
        const cleanSub = data.subTitle.replace(/<[^>]*>/g, '').trim();
        fullBodyHtml += `
            <div class="mb-10">
                <h2 class="font-display font-black text-4xl md:text-5xl text-purple-deep leading-tight">
                    ${cleanSub}
                </h2>
            </div>
        `;
    }

    // 3. Gambar Pertama (Setelah Sub Judul)
    if (data.featuredImage) {
        fullBodyHtml += renderImageBlock(data.featuredImage, "Gambar Pertama");
    }
    
    // 4. Konten Berita 2
    if (data.content2) {
        fullBodyHtml += `<div class="mb-10 text-gray-700 leading-relaxed text-lg font-alice">${data.content2}</div>`;
    }
    
    // 5. Konten Berita 3
    if (data.content3) {
        fullBodyHtml += `<div class="mb-10 text-gray-700 leading-relaxed text-lg font-alice">${data.content3}</div>`;
    }

    // 6. Gambar Kedua (Sebelum Kutipan)
    if (data.featuredImage2) {
        fullBodyHtml += renderImageBlock(data.featuredImage2, "Gambar Kedua");
    }
    
    // 7. Kutipan (Italicized)
    if (data.quotes && data.quotes.trim() !== "") {
        fullBodyHtml += `
            <div class="mb-10 p-8 pl-14 bg-purple-pale/30 border-l-4 border-purple-med rounded-r-3xl italic text-purple-deep/80 text-xl font-alice relative overflow-hidden">
                <div class="absolute top-3 left-4 opacity-25 pointer-events-none col-purple-med">
                    <i data-lucide="quote" class="w-8 h-8 text-purple-med/70"></i>
                </div>
                <span class="relative z-10">"${data.quotes}"</span>
            </div>
        `;
    }

    // 8. Konten Berita 4
    if (data.content4) {
        fullBodyHtml += `<div class="mb-10 text-gray-700 leading-relaxed text-lg font-alice">${data.content4}</div>`;
    }

    // 9. Gambar Ketiga (Sebelum Konten Berita Terakhir)
    if (data.featuredImage3) {
        fullBodyHtml += renderImageBlock(data.featuredImage3, "Gambar Ketiga");
    }

    // 10. Konten Berita 5 (Konten Berita Terakhir)
    if (data.content5) {
        fullBodyHtml += `<div class="mb-10 text-gray-700 leading-relaxed text-lg font-alice">${data.content5}</div>`;
    }
    
    // 11. Tagar
    if (data.hashtags && data.hashtags.trim() !== "") {
        const tags = data.hashtags.split(' ').map(tag => {
            if (!tag.startsWith('#')) tag = '#' + tag;
            return `<span class="inline-block px-5 py-2.5 bg-purple-pale/60 text-purple-med text-sm font-bold rounded-full mr-3 mb-3 hover:bg-purple-med hover:text-white transition-all duration-300 cursor-pointer border border-purple-pale shadow-sm">
                ${tag}
            </span>`;
        }).join('');
        fullBodyHtml += `
            <div class="mt-20 pt-10 border-t border-purple-pale/50 flex flex-wrap items-center">
                ${tags}
            </div>
        `;
    }

    // Fallback untuk data lama
    const hasNewBlocks = !!(data.content1 || data.content2 || data.content3 || data.content4 || data.content5);
    if (!hasNewBlocks && data.contentBody) {
        fullBodyHtml = `<div class="text-gray-700 leading-relaxed font-alice text-lg">${data.contentBody}</div>`;
    }

    // Inject konten
    document.getElementById('article-body').innerHTML = fullBodyHtml;

    // featured image at the top (only shown for old legacy articles)
    const featureImg = document.getElementById('article-feature-image');
    if (featureImg) {
        if (data.featuredImage && !hasNewBlocks) {
            featureImg.src = data.featuredImage;
            featureImg.onload = () => {
                featureImg.classList.remove('opacity-0');
            };
            featureImg.parentElement.classList.remove('hidden');
        } else {
            featureImg.classList.add('opacity-0');
            featureImg.parentElement.classList.add('hidden');
        }
    }


    /* =========================================
       SHARE LINK
    ========================================= */

    const url = window.location.href;

    const text = `${data.title} ${url}`;

    const encodedText = encodeURIComponent(text);

    // whatsapp
    document.getElementById('wa-share')?.setAttribute(
        'href',
        `https://wa.me/?text=${encodedText}`
    );

    // instagram
    document.getElementById('ig-share')?.setAttribute(
        'href',
        'https://www.instagram.com/bemfaiunsika'
    );

    // tiktok
    document.getElementById('tiktok-share')?.setAttribute(
        'href',
        'https://www.tiktok.com/@bemfaiunsika'
    );

    // x / twitter
    document.getElementById('x-share')?.setAttribute(
        'href',
        `https://twitter.com/intent/tweet?text=${encodedText}`
    );


    /* =========================================
       GALERI (DOKUMENTASI CAROUSEL-SLIDER)
    ========================================= */
    if (data.gallery && data.gallery.length > 0) {

        const galleryContainer =
            document.getElementById('gallery-container');

        const track =
            document.getElementById('gallery-track');

        galleryContainer.classList.remove('hidden');

        track.innerHTML = data.gallery.map((url, i) => `
            <div
                class="w-[85vw] sm:w-[calc(50%-12px)] md:w-[calc(33.333%-16px)] lg:w-[calc(25%-18px)] flex-shrink-0 rounded-2xl overflow-hidden shadow-xl border border-purple-pale/50 cursor-pointer gallery-item relative group h-48 md:h-56 select-none"
                onclick="openLightbox(${i})">

                <img
                    src="${url}"
                    class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 pointer-events-none"
                    alt="Dokumentasi ${i + 1}">

                <div class="absolute inset-0 bg-purple-med/20 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
            </div>
        `).join('');

        // simpan gallery global
        window.galleryImages = data.gallery;

        // init lightbox
        initLightbox();

        // init horizontal autoplay carousel
        initGalleryCarousel();
    }


    /* =========================================
       RE-RENDER ICON
    ========================================= */
    requestAnimationFrame(() => {

        if (window.lucide) {
            lucide.createIcons();
        }

    });
}


/* =========================================
   LOAD BERITA TERKAIT
========================================= */
async function loadRelated(category, currentId) {

    const container =
        document.getElementById('related-news');

    // query berita terbaru
    const q = query(
        collection(db, 'news'),
        orderBy('date', 'desc'),
        limit(5)
    );

    const querySnapshot = await getDocs(q);

    let html = '';

    querySnapshot.forEach(docSnap => {

        const item = docSnap.data();

        // skip artikel sekarang
        if (docSnap.id !== currentId) {

            html += `
                <a href="view.html?id=${docSnap.id}"
                   class="group flex items-center gap-4">

                    <div class="w-20 h-20 rounded-2xl overflow-hidden flex-shrink-0">

                        <img
                            src="${item.featuredImage}"
                            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">

                    </div>

                    <div>

                        <span class="text-[10px] text-purple-med font-bold uppercase tracking-tighter">
                            ${item.category}
                        </span>

                        <h5 class="text-sm font-bold text-purple-deep group-hover:text-purple-med transition-colors line-clamp-2">
                            ${item.title}
                        </h5>

                    </div>

                </a>
            `;
        }
    });

    container.innerHTML = html || `
        <p class="text-xs text-gray-400 italic">
            Tidak ada berita terkait.
        </p>
    `;
}


/* =========================================
   NAVBAR EFFECT SAAT SCROLL
========================================= */
function initNavbar() {

    const wrapper =
        document.getElementById('app-wrapper');

    wrapper.addEventListener('scroll', () => {

        const nav =
            document.getElementById('nav-container');

        if (wrapper.scrollTop > 50) {
            nav.classList.add('nav-scrolled');
        } else {
            nav.classList.remove('nav-scrolled');
        }

    });
}


/* =========================================
   PROGRESS BAR
========================================= */
function initScrollProgress() {

    const wrapper =
        document.getElementById('app-wrapper');

    const bar =
        document.getElementById('progress-bar');

    wrapper.addEventListener('scroll', () => {

        const winScroll = wrapper.scrollTop;

        const height =
            wrapper.scrollHeight - wrapper.clientHeight;

        const scrolled =
            (winScroll / height) * 100;

        bar.style.width = `${scrolled}%`;

    });
}


/* =========================================
   COPY LINK
========================================= */
function initCopyLink() {

    const btn =
        document.getElementById('copy-link');

    const toast =
        document.getElementById('copy-toast');

    btn.addEventListener('click', async () => {

        try {

            await navigator.clipboard.writeText(
                window.location.href
            );

            toast.classList.replace(
                'opacity-0',
                'opacity-100'
            );

            setTimeout(() => {

                toast.classList.replace(
                    'opacity-100',
                    'opacity-0'
                );

            }, 2000);

        } catch (err) {

            console.error('Copy gagal:', err);

        }

    });
}


/* =========================================
   SHARE DROPDOWN
========================================= */
function initShareDropdown() {

    const toggle =
        document.getElementById('share-toggle');

    const menu =
        document.getElementById('share-menu');

    if (!toggle || !menu) return;

    toggle.addEventListener('click', (e) => {

        e.stopPropagation();

        menu.classList.toggle('opacity-0');
        menu.classList.toggle('pointer-events-none');

    });

    // klik luar -> close
    document.addEventListener('click', () => {

        menu.classList.add('opacity-0');
        menu.classList.add('pointer-events-none');

    });
}


/* =========================================
   LIGHTBOX GALERI
========================================= */
function initLightbox() {

    const lightbox =
        document.getElementById('lightbox');

    const lightboxImg =
        document.getElementById('lightbox-img');

    let currentIndex = 0;

    // buka lightbox
    window.openLightbox = (index) => {

        currentIndex = index;

        lightboxImg.src =
            window.galleryImages[currentIndex];

        lightbox.classList.add('open');

        document.body.style.overflow = 'hidden';
    };

    // close
    document.getElementById('close-lightbox').onclick = () => {

        lightbox.classList.remove('open');

        document.body.style.overflow = 'auto';
    };

    // next image
    const next = () => {

        currentIndex =
            (currentIndex + 1) % window.galleryImages.length;

        lightboxImg.src =
            window.galleryImages[currentIndex];
    };

    // prev image
    const prev = () => {

        currentIndex =
            (currentIndex - 1 + window.galleryImages.length)
            % window.galleryImages.length;

        lightboxImg.src =
            window.galleryImages[currentIndex];
    };

    // button next prev
    document.getElementById('next-btn').onclick = next;
    document.getElementById('prev-btn').onclick = prev;

    // keyboard support
    document.addEventListener('keydown', (e) => {

        if (!lightbox.classList.contains('open')) return;

        if (e.key === 'ArrowRight') next();

        if (e.key === 'ArrowLeft') prev();

        if (e.key === 'Escape') {

            lightbox.classList.remove('open');

            document.body.style.overflow = 'auto';
        }
    });
}


/* =========================================
   CAROUSEL GALERI DOKUMENTASI UNTUK 1 BARIS
========================================= */
function initGalleryCarousel() {
    const track = document.getElementById('gallery-track');
    const prevBtn = document.getElementById('gallery-prev');
    const nextBtn = document.getElementById('gallery-next');
    const dotsContainer = document.getElementById('gallery-dots-container');

    if (!track) return;

    const items = track.children;
    const totalItems = items.length;
    if (totalItems === 0) return;

    let currentIndex = 0;
    let autoSlideInterval = null;

    // Menentukan jumlah item yang tampil per baris berdasarkan lebar layar
    function getVisibleItems() {
        if (window.innerWidth >= 1024) return 4;
        if (window.innerWidth >= 768) return 3;
        if (window.innerWidth >= 640) return 2;
        return 1;
    }

    function getMaxScrollIndex() {
        return Math.max(0, totalItems - getVisibleItems());
    }

    function updateSlider() {
        const visibleCount = getVisibleItems();
        const maxIdx = getMaxScrollIndex();

        // Clamp index agar tidak out of bounds
        if (currentIndex > maxIdx) {
            currentIndex = 0;
        }
        if (currentIndex < 0) {
            currentIndex = maxIdx;
        }

        // Hitung pergeseran pixel secara dinamis
        if (items[0]) {
            const itemWidth = items[0].getBoundingClientRect().width;
            const gap = 24; // Gap antar item sesuai Tailwind "gap-6" adalah 24px
            const translateX = currentIndex * (itemWidth + gap);
            track.style.transform = `translateX(-${translateX}px)`;
        }

        // Render indikator titik (dots)
        renderDots();
    }

    function renderDots() {
        if (!dotsContainer) return;
        const visibleCount = getVisibleItems();
        const numStates = Math.max(1, totalItems - visibleCount + 1);

        let dotsHtml = '';
        for (let i = 0; i < numStates; i++) {
            const activeClass = i === currentIndex 
                ? 'bg-purple-med w-5' 
                : 'bg-purple-soft/60 hover:bg-purple-med/60 w-2';
            dotsHtml += `
                <button type="button" class="h-2 rounded-full transition-all duration-300 ${activeClass}" onclick="window.goToGallerySlide(${i})"></button>
            `;
        }
        dotsContainer.innerHTML = dotsHtml;
    }

    // Fungsi navigasi eksternal
    window.goToGallerySlide = (index) => {
        currentIndex = index;
        updateSlider();
        resetAutoSlide();
    };

    function slideNext() {
        const maxIdx = getMaxScrollIndex();
        if (currentIndex >= maxIdx) {
            currentIndex = 0; // Wrap back to first item
        } else {
            currentIndex++;
        }
        updateSlider();
    }

    function slidePrev() {
        const maxIdx = getMaxScrollIndex();
        if (currentIndex <= 0) {
            currentIndex = maxIdx; // Wrap to end
        } else {
            currentIndex--;
        }
        updateSlider();
    }

    // Event listener tombol navigasi
    if (prevBtn) prevBtn.addEventListener('click', () => { slidePrev(); resetAutoSlide(); });
    if (nextBtn) nextBtn.addEventListener('click', () => { slideNext(); resetAutoSlide(); });

    // Dukungan drag/geser mouse & layar sentuh mobile
    let startX = 0;
    let isDragging = false;

    track.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.pageX;
        track.style.transition = 'none';
        resetAutoSlide();
    });

    track.addEventListener('mouseleave', () => {
        if (!isDragging) return;
        isDragging = false;
        track.style.transition = 'transform 0.7s cubic-bezier(0.23, 1, 0.32, 1)';
        updateSlider();
    });

    track.addEventListener('mouseup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        track.style.transition = 'transform 0.7s cubic-bezier(0.23, 1, 0.32, 1)';
        const endX = e.pageX;
        const diffX = endX - startX;
        if (diffX < -50) {
            slideNext();
        } else if (diffX > 50) {
            slidePrev();
        } else {
            updateSlider();
        }
    });

    // Touch support untuk handphone
    track.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].pageX;
        track.style.transition = 'none';
        resetAutoSlide();
    }, { passive: true });

    track.addEventListener('touchend', (e) => {
        if (!isDragging) return;
        isDragging = false;
        track.style.transition = 'transform 0.7s cubic-bezier(0.23, 1, 0.32, 1)';
        const endX = e.changedTouches[0].pageX;
        const diffX = endX - startX;
        if (diffX < -50) {
            slideNext();
        } else if (diffX > 50) {
            slidePrev();
        } else {
            updateSlider();
        }
    }, { passive: true });

    // Mulai auto slide interval (geser otomatis 4 detik sekali)
    function startAutoSlide() {
        if (totalItems <= getVisibleItems()) return;
        autoSlideInterval = setInterval(() => {
            slideNext();
        }, 4000);
    }

    function resetAutoSlide() {
        if (autoSlideInterval) {
            clearInterval(autoSlideInterval);
            startAutoSlide();
        }
    }

    // Inisialisasi awal
    startAutoSlide();
    updateSlider();

    // Adaptif saat ukuran window berubah
    window.addEventListener('resize', () => {
        track.style.transition = 'none';
        updateSlider();
        setTimeout(() => {
            track.style.transition = 'transform 0.7s cubic-bezier(0.23, 1, 0.32, 1)';
        }, 50);
    });
}


/* =========================================
   MOBILE MENU
========================================= */
function initMobileMenu() {

    const toggle =
        document.getElementById('mobile-toggle');

    const menu =
        document.getElementById('mobile-menu');

    let isOpen = false;

    if (!toggle || !menu) return;

    // toggle menu
    toggle.addEventListener('click', (e) => {

        e.stopPropagation();

        isOpen = !isOpen;

        if (isOpen) {

            menu.classList.remove(
                'max-h-0',
                'opacity-0',
                'pointer-events-none'
            );

            menu.classList.add(
                'max-h-96',
                'opacity-100'
            );

            toggle.innerHTML = `
                <i data-lucide="x" class="w-6 h-6 text-purple-deep"></i>
            `;

        } else {

            menu.classList.add(
                'max-h-0',
                'opacity-0',
                'pointer-events-none'
            );

            menu.classList.remove(
                'max-h-96',
                'opacity-100'
            );

            toggle.innerHTML = `
                <i data-lucide="menu" class="w-6 h-6 text-purple-deep"></i>
            `;
        }

        lucide.createIcons();
    });

    // klik luar -> close
    document.addEventListener('click', () => {

        isOpen = false;

        menu.classList.add(
            'max-h-0',
            'opacity-0',
            'pointer-events-none'
        );

        menu.classList.remove(
            'max-h-96',
            'opacity-100'
        );

        toggle.innerHTML = `
            <i data-lucide="menu" class="w-6 h-6 text-purple-deep"></i>
        `;

        lucide.createIcons();
    });

    // klik dalam menu tidak close
    menu.addEventListener('click', (e) => {
        e.stopPropagation();
    });
}


/* =========================================
   CARI BERITA LAIN (AUTO-SUGGESTION)
========================================= */
async function initSearch() {
    const searchInput = document.getElementById('sidebar-search');
    const suggestionsContainer = document.getElementById('search-suggestions');
    if (!searchInput || !suggestionsContainer) return;

    let articlesList = [];

    try {
        const qSnapshot = await getDocs(collection(db, 'news'));
        qSnapshot.forEach(docSnap => {
            const data = docSnap.data();
            articlesList.push({
                id: docSnap.id,
                title: data.title || '',
                category: data.category || '',
                featuredImage: data.featuredImage || '',
                date: data.date ? new Date(data.date) : new Date(0)
            });
        });
        
        // Urutkan berita terbaru di atas
        articlesList.sort((a, b) => b.date - a.date);
    } catch (err) {
        console.error('Gagal mengambil daftar berita untuk pencarian:', err);
    }

    searchInput.addEventListener('input', () => {
        const queryVal = searchInput.value.toLowerCase().trim();
        if (!queryVal) {
            suggestionsContainer.classList.add('hidden');
            suggestionsContainer.innerHTML = '';
            return;
        }

        // Cari berdasarkan kemiripan judul atau kategori
        const filtered = articlesList.filter(article => 
            article.title.toLowerCase().includes(queryVal) ||
            article.category.toLowerCase().includes(queryVal)
        );

        if (filtered.length === 0) {
            suggestionsContainer.innerHTML = `
                <div class="p-4 text-xs text-center text-gray-500 italic">
                    Tidak ada berita ditemukan
                </div>
            `;
            suggestionsContainer.classList.remove('hidden');
            return;
        }

        suggestionsContainer.innerHTML = filtered.map(article => `
            <a href="view.html?id=${article.id}" class="flex items-center gap-3 p-3 hover:bg-purple-pale/50 transition border-b border-purple-pale/30 last:border-none">
                ${article.featuredImage ? `
                <div class="w-10 h-10 rounded-lg overflow-hidden flex-shrink-0">
                    <img src="${article.featuredImage}" class="w-full h-full object-cover">
                </div>
                ` : `
                <div class="w-10 h-10 rounded-lg bg-purple-soft/30 flex items-center justify-center text-purple-med flex-shrink-0">
                    <i data-lucide="newspaper" class="w-5 h-5"></i>
                </div>
                `}
                <div class="flex-1 min-w-0">
                    <div class="text-[9px] text-purple-med/70 font-bold uppercase tracking-wider mb-0.5">${article.category}</div>
                    <div class="text-xs font-semibold text-purple-deep line-clamp-2 leading-tight">${article.title}</div>
                </div>
            </a>
        `).join('');

        // Re-render lucide jika ada
        if (window.lucide) {
            lucide.createIcons();
        }

        suggestionsContainer.classList.remove('hidden');
    });

    // Event listener: Klik luar -> sembunyikan dropdown
    document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !suggestionsContainer.contains(e.target)) {
            suggestionsContainer.classList.add('hidden');
        }
    });

    // Munculkan kembali dropdown jika input fokus dan memiliki nilai
    searchInput.addEventListener('focus', () => {
        if (searchInput.value.trim()) {
            suggestionsContainer.classList.remove('hidden');
        }
    });
}
