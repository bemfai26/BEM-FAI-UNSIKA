    <style>
        html, body { height: 100%; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .font-display { font-family: 'Playfair Display', serif; }
        
        /* Navbar Styles */
        #nav-container { 
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            width: 95%;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-capsule {
            margin-top: 1.5rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 190, 240, 0.3);
            box-shadow: 0 10px 40px rgba(45, 27, 78, 0.05);
        }
        .nav-scrolled .nav-capsule {
            margin-top: 0.75rem;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 15px 45px rgba(45, 27, 78, 0.12);
            border: 1px solid rgba(155, 114, 207, 0.1);
        }

        /* Reading Progress Bar */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(to right, #5B3A8C, #9B72CF);
            z-index: 100;
            width: 0%;
            transition: width 0.1s ease;

        /* Content Styling */
        .article-content p { margin-bottom: 1.5rem; line-height: 1.8; color: #4B5563; }
        .article-content h2 { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.875rem; color: #2D1B4E; margin-top: 2.5rem; margin-bottom: 1rem; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animation */
        .section-fade { opacity: 0; transition: all 0.8s ease; transform: translateY(20px); }
        .visible { opacity: 1; transform: translateY(0); }

        /* Image Clarity */
        .gallery-item img {
            filter: contrast(1.05) saturate(1.1);
            transition: all 0.5s ease;
        }
        .gallery-item:hover img {
            filter: contrast(1.1) saturate(1.2);
        }

        /* Lightbox Styles */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .lightbox-content { max-width: 65%; max-height: 75%; position: relative; transform: scale(0.9); transition: transform 0.3s ease; }
        #lightbox.open { display: flex; animation: fadeIn 0.3s ease forwards; }
        #lightbox.open .lightbox-content { transform: scale(1); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Skeleton */
        .skeleton { background: #f3f4f6; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; border-radius: 1rem; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>

    <!-- JAVASCRIPT -->
    <script type="module">
    import { db, doc, getDoc, collection, getDocs, query, orderBy, limit } from '../../js/firebase-init.js';

    /* =========================================
       FORMAT TANGGAL INDONESIA
    ========================================= */
    function formatTanggal(dateString) {
        const bulanIndonesia = [
            "Januari", "Februari", "Maret", "April",
            "Mei", "Juni", "Juli", "Agustus",
            "September", "Oktober", "November", "Desember"
        ];

        const date = new Date(dateString);

        const hari = date.getDate();
        const bulan = bulanIndonesia[date.getMonth()];
        const tahun = date.getFullYear();

        return `${hari} ${bulan} ${tahun}`;
    }

    /* =========================================
       INIT HALAMAN
    ========================================= */
    document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();

        const urlParams = new URLSearchParams(window.location.search);
        const newsId = urlParams.get('id');

        if (newsId) {
            loadArticle(newsId);
        } else {
            window.location.href = '../home-berita.html';
        }

        initNavbar();
        initScrollProgress();
        initCopyLink();
    });

    /* =========================================
       LOAD ARTIKEL DARI FIREBASE
    ========================================= */
    async function loadArticle(id) {
        try {
            const docRef = doc(db, 'news', id);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                displayArticle(data);
                loadRelated(data.category, id);
            } else {
                document.getElementById('article-title').innerText = 'Berita Tidak Ditemukan';
                document.getElementById('article-body').innerHTML = `
                    <p class="text-center py-20 px-4 bg-red-50 rounded-2xl text-red-500 font-bold">
                        Maaf, berita yang anda cari tidak ada atau sudah dihapus.
                    </p>
                `;
                document.getElementById('article-category').innerText = '404';
                document.getElementById('article-feature-image').classList.add('hidden');
            }

        } catch (error) {
            console.error("Error loading article:", error);
            document.getElementById('article-title').innerText = 'Error';
            document.getElementById('article-body').innerHTML = `
                <p class="text-center py-20 text-red-500 font-bold">
                    Gagal memuat berita: ${error.message}
                </p>
            `;
        }
    }

    /* =========================================
       DISPLAY ARTIKEL KE UI
    ========================================= */
    function displayArticle(data) {

        document.title = `${data.title} - BEM FAI UNSIKA`;

        const titleParts = data.title.split(' ');

        const mainTitle = titleParts.slice(0, 3).join(' ');
        const subTitle = titleParts.slice(3).join(' ');

        document.getElementById('article-title').innerHTML = `
            ${mainTitle}
            ${subTitle ? `
            <span class="italic text-purple-med/70 font-light underline decoration-purple-soft/50 underline-offset-8">
            ${subTitle}
            </span>
            ` : ''}
            `;
        document.getElementById('article-category').innerText = data.category;

        /* FIX: FORMAT TANGGAL INDONESIA */
        document.getElementById('article-date').innerHTML = `
            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
            ${formatTanggal(data.date)}
        `;

        document.getElementById('article-author').innerText = data.author;
        document.getElementById('article-body').innerHTML = data.contentBody;

        const featureImg = document.getElementById('article-feature-image');
        featureImg.src = data.featuredImage;
        featureImg.classList.remove('opacity-0');

        const waShare = document.getElementById('share-wa');
if (waShare) {
    waShare.href =
        `https://wa.me/?text=${encodeURIComponent(data.title + ' ' + window.location.href)}`;
}

        /* GALERI */
        if (data.gallery && data.gallery.length > 0) {
            const galleryContainer = document.getElementById('gallery-container');
            const grid = document.getElementById('gallery-grid');

            galleryContainer.classList.remove('hidden');

            grid.innerHTML = data.gallery.map((url, i) => `
                <div class="rounded-2xl overflow-hidden shadow-xl border border-purple-pale/50 cursor-pointer gallery-item relative group h-48 md:h-56"
                     onclick="openLightbox(${i})">

                    <img src="${url}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">

                    <div class="absolute inset-0 bg-purple-med/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </div>
            `).join('');

            window.galleryImages = data.gallery;
            initLightbox();
        }

        lucide.createIcons();
    }

    /* =========================================
       BERITA TERKAIT
    ========================================= */
    async function loadRelated(category, currentId) {
        const container = document.getElementById('related-news');

        const q = query(collection(db, 'news'), limit(5));
        const querySnapshot = await getDocs(q);

        let html = '';

        querySnapshot.forEach(docSnap => {
            const item = docSnap.data();

            if (docSnap.id !== currentId) {
                html += `
                    <a href="view.html?id=${docSnap.id}" class="group flex items-center gap-4">

                        <div class="w-20 h-20 rounded-2xl overflow-hidden flex-shrink-0">
                            <img src="${item.featuredImage}"
                                 class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        </div>

                        <div>
                            <span class="text-[10px] text-purple-med font-bold uppercase tracking-tighter">
                                ${item.category}
                            </span>

                            <h5 class="text-sm font-bold text-purple-deep group-hover:text-purple-med transition-colors line-clamp-2">
                                ${item.title}
                            </h5>
                        </div>

                    </a>
                `;
            }
        });

        container.innerHTML = html || `
            <p class="text-xs text-gray-400 italic">Tidak ada berita terkait.</p>
        `;
    }

    /* =========================================
       NAVBAR SCROLL EFFECT
    ========================================= */
    function initNavbar() {
        const wrapper = document.getElementById('app-wrapper');

        wrapper.addEventListener('scroll', () => {
            const nav = document.getElementById('nav-container');

            if (wrapper.scrollTop > 50) {
                nav.classList.add('nav-scrolled');
            } else {
                nav.classList.remove('nav-scrolled');
            }
        });
    }

    /* =========================================
       PROGRESS BAR SCROLL
    ========================================= */
    function initScrollProgress() {
        const wrapper = document.getElementById('app-wrapper');
        const bar = document.getElementById('progress-bar');

        wrapper.addEventListener('scroll', () => {
            const winScroll = wrapper.scrollTop;
            const height = wrapper.scrollHeight - wrapper.clientHeight;
            const scrolled = (winScroll / height) * 100;

            bar.style.width = scrolled + "%";
        });
    }

    /* =========================================
       COPY LINK BUTTON
    ========================================= */
    function initCopyLink() {
        const btn = document.getElementById('copy-link');
        const toast = document.getElementById('copy-toast');

        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                toast.classList.replace('opacity-0', 'opacity-100');

                setTimeout(() => {
                    toast.classList.replace('opacity-100', 'opacity-0');
                }, 2000);
            });
        });
    }

    /* =========================================
       SHARE DROPDOWN
    ========================================= */
    function initShareDropdown() {
    const toggle = document.getElementById('share-toggle');
    const menu = document.getElementById('share-menu');

    toggle.addEventListener('click', (e) => {
        e.stopPropagation();

        menu.classList.toggle('opacity-0');
        menu.classList.toggle('pointer-events-none');
    });

    // klik luar untuk nutup
    document.addEventListener('click', () => {
        menu.classList.add('opacity-0');
        menu.classList.add('pointer-events-none');
    });
    }

    /* =========================================
       LIGHTBOX GALERI
    ========================================= */
    function initLightbox() {
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        let currentIndex = 0;

        window.openLightbox = (index) => {
            currentIndex = index;
            lightboxImg.src = window.galleryImages[currentIndex];
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        };

        document.getElementById('close-lightbox').onclick = () => {
            lightbox.classList.remove('open');
            document.body.style.overflow = 'auto';
        };

        const next = () => {
            currentIndex = (currentIndex + 1) % window.galleryImages.length;
            lightboxImg.src = window.galleryImages[currentIndex];
        };

        const prev = () => {
            currentIndex = (currentIndex - 1 + window.galleryImages.length) % window.galleryImages.length;
            lightboxImg.src = window.galleryImages[currentIndex];
        };

        document.getElementById('next-btn').onclick = next;
        document.getElementById('prev-btn').onclick = prev;

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;

            if (e.key === 'ArrowRight') next();
            if (e.key === 'ArrowLeft') prev();
            if (e.key === 'Escape') {
                lightbox.classList.remove('open');
                document.body.style.overflow = 'auto';
            }
        });
    }

</script>
