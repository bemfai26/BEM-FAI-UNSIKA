<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita & Kegiatan - BEM FAI UNSIKA</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon/logo.png">

    <!-- Tailwind + Config -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'purple-deep': '#2D1B4E',
                        'purple-med': '#5B3A8C',
                        'purple-light': '#9B72CF',
                        'purple-soft': '#D4BEF0',
                        'purple-pale': '#F3ECFA',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        display: ['Playfair Display', 'serif'],
                        alice: ['Alice', 'serif']
                    }
                }
            }
        }
    </script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&family=Alice&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

    <style>
        html, body { height: 100%; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .font-display { font-family: 'Playfair Display', serif; }
        .font-alice { font-family: 'Alice', serif; }
        
        #nav-container { transition: all 0.5s ease; width: 95%; left: 50%; transform: translateX(-50%); }
        .nav-capsule { margin-top: 1.5rem; border-radius: 999px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(155, 114, 207, 0.2); box-shadow: 0 10px 40px rgba(45, 27, 78, 0.05); }
        .nav-scrolled .nav-capsule { margin-top: 0.75rem; background: rgba(255, 255, 255, 0.98); box-shadow: 0 15px 45px rgba(45, 27, 78, 0.12); }
        .nav-active { color: #9B72CF; position: relative; }
        .nav-active::after { content: ''; position: absolute; bottom: -4px; left: 0; right: 0; height: 2px; background: #9B72CF; border-radius: 1px; }

        .article-card { transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .article-card:hover { transform: translateY(-15px); box-shadow: 0 30px 60px -12px rgba(45, 27, 78, 0.12); }
        
        .category-btn.active { background-color: #5B3A8C !important; color: white !important; transform: scale(1.08); }
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="bg-[#FDFBFF]">

    <div id="app-wrapper" class="w-full h-full overflow-auto">
        
        <!-- NAVBAR -->
        <div id="nav-container" class="fixed top-0 z-50 transition-all">
            <nav id="navbar" class="nav-capsule max-w-7xl mx-auto transition-all">
                <div class="px-6">
                    <div class="flex items-center justify-between h-16 lg:h-20">
                        <a href="../index.html" class="flex items-center gap-3">
                            <img src="../assets/Logo/logo-bem.png" class="w-10 h-10 rounded-full border-2 border-purple-pale">
                            <div class="font-bold text-purple-deep text-sm leading-tight uppercase">BEM FAI UNSIKA</div>
                        </a>
                        <div class="hidden lg:flex items-center gap-4">
                            <a href="../index.html" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-purple-med">Beranda</a>
                            <a href="home-berita.html" class="px-4 py-2 text-sm font-bold text-purple-med nav-active">Berita</a>
                        </div>
                        <button id="mobile-toggle" class="lg:hidden p-3"><i data-lucide="menu"></i></button>
                    </div>
                </div>
            </nav>
        </div>

        <header class="pt-40 pb-20 bg-[#F3ECFA]/30 text-center relative px-4">
            <h1 class="font-display text-5xl sm:text-7xl font-black text-purple-deep mb-10 italic">Jendela <span class="text-purple-med/70 font-light">Aktivitas.</span></h1>
            
            <!-- SEARCH BAR -->
            <div class="max-w-2xl mx-auto relative mb-10">
                <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="blog-search" placeholder="Cari berita atau kegiatan..." class="w-full pl-14 pr-6 py-4 bg-white rounded-2xl shadow-lg border border-purple-pale focus:outline-none">
            </div>

            <!-- CATEGORY FILTERS -->
            <div class="flex flex-wrap justify-center gap-3">
                <button class="category-btn active px-6 py-2 rounded-full border bg-white text-gray-500 font-bold" data-filter="all">Semua</button>
                <button class="category-btn px-6 py-2 rounded-full border bg-white text-gray-500 font-bold" data-filter="Kegiatan">Kegiatan</button>
                <button class="category-btn px-6 py-2 rounded-full border bg-white text-gray-500 font-bold" data-filter="Sosial">Sosial</button>
                <button class="category-btn px-6 py-2 rounded-full border bg-white text-gray-500 font-bold" data-filter="Pelatihan">Pelatihan</button>
            </div>
        </header>

        <!-- BERITA UTAMA (FEATURED) -->
        <section id="featured-section" class="max-w-7xl mx-auto px-4 -mt-8 relative z-20 hidden"></section>

        <!-- GRID BERITA -->
        <main class="max-w-7xl mx-auto px-4 py-24">
            <h2 class="font-display text-4xl font-black text-purple-deep mb-12">Semua Berita</h2>
            <div id="berita-grid" class="grid grid-cols-1 md:grid-cols-3 gap-10">
                <!-- Loading State -->
                <div class="h-64 bg-gray-100 animate-pulse rounded-3xl"></div>
                <div class="h-64 bg-gray-100 animate-pulse rounded-3xl"></div>
                <div class="h-64 bg-gray-100 animate-pulse rounded-3xl"></div>
            </div>
            <!-- PAGINATION -->
            <div id="pagination-container" class="mt-20 flex justify-center gap-4"></div>
        </main>

        <footer class="py-10 text-white text-center" style="background: linear-gradient(160deg, #2D1B4E, #5B3A8C);">
            <p>© 2026 BEM FAI UNSIKA - Kabinet Poros Katalist</p>
        </footer>

        <button id="backToTop" class="fixed bottom-5 right-5 w-12 h-12 bg-purple-med text-white rounded-xl shadow-lg opacity-0 transition-opacity"><i data-lucide="chevron-up" class="m-auto"></i></button>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { db, collection, getDocs, query, orderBy } from '../js/firebase-init.js';

        let currentPage = 1;
        const itemsPerPage = 6;
        let allNewsData = [];

        async function fetchNews() {
            try {
                const q = query(collection(db, 'news'), orderBy('date', 'desc'));
                const querySnapshot = await getDocs(q);
                allNewsData = [];
                querySnapshot.forEach(doc => { allNewsData.push({ id: doc.id, ...doc.data() }); });
                
                if (allNewsData.length > 0) renderFeatured(allNewsData[0]);
                updateDisplay();
            } catch (error) {
                console.error(error);
                document.getElementById('berita-grid').innerHTML = '<div class="col-span-full py-20 text-center text-red-500">Gagal memuat berita.</div>';
            }
        }

        function renderFeatured(item) {
            const summary = item.contentBody ? item.contentBody.substring(0, 200).replace(/<[^>]*>?/gm, '') : '';
            document.getElementById('featured-section').innerHTML = `
                <a href="detail-berita/view.html?id=${item.id}" class="block group">
                    <div class="bg-white rounded-[2.5rem] overflow-hidden shadow-2xl border flex flex-col md:flex-row min-h-[500px]">
                        <div class="md:w-3/5 h-64 md:h-full relative overflow-hidden">
                            <img src="${item.featuredImage}" class="w-full h-full object-cover group-hover:scale-105 transition-all">
                        </div>
                        <div class="md:w-2/5 p-12 flex flex-col justify-center bg-white">
                            <div class="text-xs text-purple-med/60 font-bold mb-4">${item.date}</div>
                            <h2 class="font-display text-4xl font-black text-purple-deep mb-6 italic">${item.title}</h2>
                            <p class="text-gray-500 font-alice italic mb-8">${summary}...</p>
                            <span class="text-purple-med font-black text-xs tracking-widest flex items-center gap-2">BACA SELENGKAPNYA <i data-lucide="external-link"></i></span>
                        </div>
                    </div>
                </a>
            `;
            document.getElementById('featured-section').classList.remove('hidden');
            lucide.createIcons();
        }

        function updateDisplay() {
            const grid = document.getElementById('berita-grid');
            const filter = document.querySelector('.category-btn.active').getAttribute('data-filter');
            const searchQuery = document.getElementById('blog-search').value.toLowerCase();

            const filtered = allNewsData.filter(item => {
                const categoryMatch = filter === 'all' || item.category === filter;
                const titleMatch = item.title.toLowerCase().includes(searchQuery);
                return categoryMatch && titleMatch;
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const items = filtered.slice(start, start + itemsPerPage);

            grid.innerHTML = items.map(item => `
                <article class="article-card bg-white rounded-3xl overflow-hidden shadow-lg border border-purple-pale/30 flex flex-col">
                    <a href="detail-berita/view.html?id=${item.id}" class="block h-48 overflow-hidden relative">
                        <img src="${item.featuredImage}" class="w-full h-full object-cover">
                        <span class="absolute top-4 left-4 px-3 py-1 bg-white/90 text-purple-med text-[10px] font-black rounded-full uppercase">${item.category}</span>
                    </a>
                    <div class="p-6">
                        <div class="text-xs text-gray-400 mb-2">${item.date}</div>
                        <h3 class="font-bold text-purple-deep mb-4 italic line-clamp-2">${item.title}</h3>
                        <a href="detail-berita/view.html?id=${item.id}" class="text-purple-med font-black text-xs tracking-widest flex items-center gap-2">BACA SELENGKAPNYA <i data-lucide="external-link"></i></a>
                    </div>
                </article>
            `).join('') || '<div class="col-span-full py-20 text-center text-gray-400">Tidak ada berita.</div>';

            renderPagination(totalPages);
            lucide.createIcons();
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('pagination-container');
            container.innerHTML = '';
            if (totalPages <= 1) return;
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `w-10 h-10 rounded-lg border font-bold ${i === currentPage ? 'bg-purple-med text-white' : 'bg-white text-gray-500'}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; updateDisplay(); window.scrollTo({top: 500, behavior: 'smooth'}); };
                container.appendChild(btn);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchNews();
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPage = 1;
                    updateDisplay();
                };
            });
            document.getElementById('blog-search').oninput = () => { currentPage = 1; updateDisplay(); };
            
            const wrapper = document.getElementById('app-wrapper');
            wrapper.addEventListener('scroll', () => {
                if (wrapper.scrollTop > 500) document.getElementById('backToTop').style.opacity = 1;
                else document.getElementById('backToTop').style.opacity = 0;
            });
            lucide.createIcons();
        });
    </script>
</body>
</html>
